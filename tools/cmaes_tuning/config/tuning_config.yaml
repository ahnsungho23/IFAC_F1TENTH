schema: cmaes_tuning_config/1

paths:
  baseline_planner_yaml: src/local_planning/config/local_planning.yaml
  parameter_space_yaml: tools/cmaes_tuning/config/parameter_space.yaml
  clean_map_yaml: src/monte_carlo_localization/maps/ifac_track.yaml
  waypoint_json: offline_trajectory_generator/output/ifac_track/global_waypoints.json
  waypoint_csv: offline_trajectory_generator/output/ifac_track/global_waypoints.csv
  lap_referee_params: src/lap_referee/config/lap_referee.yaml
  simulator_workspace: /home/sungho/f1sim_C
  simulator_config: /home/sungho/f1sim_C/f1tenth_gym_ros/config/sim.yaml
  output_root: /tmp/cmaes_tuning

experiment:
  map_name: ifac_track
  experiment_seed: 260809
  fixed_training_scenario_ids: [train_000, train_001, train_002]
  fixed_training_seeds: [260901, 260902, 260903]
  generator_version: cmaes_static_single_v1

scenario:
  categories: [straight, corner_entry, corner_mid]
  lateral_bands: [left, center, right]
  obstacle_shape: rect
  obstacle_width_m: 0.50
  obstacle_height_m: 0.50
  obstacle_yaw_rad: 0.0
  spawn_distance_before_obstacle_m: 8.0
  minimum_spawn_obstacle_distance_m: 6.0
  maximum_candidate_clearance_m: 0.37
  map_validation_sample_step_m: 0.0125

ros:
  ros_setup: /opt/ros/jazzy/setup.bash
  workspace_setup: install/setup.bash
  simulator_setup: /home/sungho/f1sim_C/install/local_setup.bash
  domain_id_start: 121
  use_sim_time: false
  required_topics_before_control:
    - /ego_racecar/odom
    - /scan
    - /ego_racecar/collision
    - /global_waypoints
    - /pf/pose/odom
    - /car_state/frenet/odom
    - /state
    - /static_obs
    - /avoid_waypoints
  recorded_topics:
    - /ego_racecar/odom
    - /drive
    - /drive_autonomous
    - /ego_racecar/collision
    - /avoid_waypoints
    - /local_waypoints
    - /global_waypoints
    - /state
    - /static_obs

controller:
  # Framework-validation condition. This is intentionally not the old 1.5 m/s CMA condition.
  max_speed_mps: 3.0
  min_speed_mps: 1.0
  max_lateral_accel_mps2: 10.0
  base_max_accel_mps2: 9.0
  base_max_decel_mps2: 8.0
  launch_boost_enable: true
  deadzone_floor_speed_mps: 0.0

runner:
  ready_timeout_sec: 35.0
  episode_timeout_sec: 65.0
  process_sigint_timeout_sec: 3.0
  process_sigterm_timeout_sec: 2.0
  recorder_flush_timeout_sec: 8.0
  topic_probe_timeout_sec: 4.0
  max_infrastructure_retries: 1
  poll_period_sec: 0.20

evaluation:
  vehicle_length_m: 0.56
  vehicle_width_m: 0.287
  footprint_sample_step_m: 0.0125
  start_speed_threshold_mps: 0.4
  lap_fraction: 0.97
  planner_stale_timeout_sec: 0.75
  safe_stop_failure_duration_sec: 1.0
  obstacle_clearance_target_m: 0.10
  wall_clearance_target_m: 0.04
  steering_tv_rate_max_radps: 20.0
  steering_rate_deadband_radps: 0.10
  curvature_rate_rms_max_radpm2: 20.0

objective:
  beta_cvar: 0.5
  cvar_alpha: 0.90
  epsilon: 1.0e-9
  weights:
    time: 1.0
    progress: 1.0
    obstacle_clearance: 2.0
    wall_clearance: 2.0
    steering_tv_rate: 0.5
    curvature_rate_rms: 0.5

cma:
  seed: 260809
  sigma0: 0.18
  population_size: 4
  generations: 2
