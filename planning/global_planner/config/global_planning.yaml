global_planner_node:
  ros__parameters:
    map_dir: "planning/global_planner/data"
    optimizer_command: "python3 planning/global_planner/vendor/gb_optimizer/src/global_planner_node_ros2.py"
    pythonpath_extra: "planning/global_planner/vendor/gb_optimizer/src:planning/global_planner/vendor/gb_optimizer"
    run_once: false
    trigger_on_start: false

global_trajectory_publisher_node:
  ros__parameters:
    map_path: "planning/global_planner/data"
    publish_markers: true
    publish_shortest_path: true
    publish_centerline: true
    publish_lattice: false
    publish_period_sec: 2.0
