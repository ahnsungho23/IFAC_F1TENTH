local_planner_node:
  ros__parameters:
    # 핵심 알고리즘 파라미터
    lookahead_wpnt_num: 40         # 연산할 전방 웨이포인트 개수
    safety_margin: 0.65            # 장애물 간섭 감지 반경 마진 (m)
    wall_margin: 0.35              # 벽 안전 마진 (m)
    avoid_offset: 1.0              # 회피 목표 횡방향 오프셋 (m)
    poly_degree: 3                 # 최소자승법 다항식 차수 (3차 스플라인)
    speed_reduction_ratio: 0.6     # 회피 주행 시 속도 감속 비율 (60%)
    publish_standalone_local: true # /local_waypoints 토픽 직접 발행 여부
    timer_period_ms: 500           # 연산 주기 (ms) - 0.5초(500ms)마다 경로 갱신

    # 토픽 및 프레임 설정 파라미터
    global_waypoints_topic: "/global_waypoints"       # 글로벌 웨이포인트 구독 토픽
    map_topic: "/map"                                 # 점유 격자 지도(Occupancy Grid Map) 구독 토픽
    frenet_odom_topic: "/car_state/frenet/odom"       # Frenet 좌표계 오도메트리 구독 토픽
    ot_waypoints_topic: "/planner/avoidance/otwpnts"  # 회피 웨이포인트(OTWpntArray) 발행 토픽
    local_waypoints_topic: "/local_waypoints"         # 스탠드얼론 로컬 웨이포인트 발행 토픽
    local_path_topic: "/local_planning/path"          # 로컬 플래닝 Path 메시지 발행 토픽
    exact_local_path_topic: "/local_path"             # 닫힌 곡선 Local Path 메시지 발행 토픽
    marker_topic: "/local_planning/markers"           # RViz 시각화 마커 배열 발행 토픽
    frame_id: "map"                                   # 기본 좌표계 프레임 ID
