# ════════════════════════════════════════════════════════════════════════════════════════════════
# 🔵 브랜치 목적 — 이 파일을 병합할 때 먼저 읽을 것 (2026-08-23)
# ════════════════════════════════════════════════════════════════════════════════════════════════
#   prototype         : 클린맵 주행 + **정적 장애물 회피**            (/opp_obs 미사용)
#   transition_global : 클린맵 주행 + 정적 회피 + **동적 추적/CRUISE**
#
# **정적 검출 경로는 두 브랜치가 같아야 한다.** 그래서 transition_global 의 검출기 개선은
# 이쪽으로 그대로 받는다 — 2026-08-23 에 18 커밋(656 줄, 시험 10 개)을 흡수했다.
#
# 🔴 2026-08-24 갱신: **이 브랜치도 이제 /opp_obs 를 쓴다.** CRUISE 파이프라인(상태머신
# 확률 간섭 술어)을 transition_global 에서 이식했기 때문이다. 따라서 예전에 "동적 전용
# 완화라 받지 않는다"고 표시해 둔 항목도 transition 값을 받는다:
#
#     dynamic_min_translation_m   0.30  ->  0.18   (transition_global 과 동일)
#
# 이제 두 브랜치의 검출기 설정에 의도적 차이는 없다. 해당 줄의 🔵 박스에 값 근거와 실측을
# 남겨 두었으니, 되돌리려면 그 박스를 먼저 읽을 것 — 0.30 으로 올리면 감속하며 코너에
# 진입하는 상대차가 DYNAMIC 이 되지 못해 /opp_obs 가 비고 CRUISE 가 아예 걸리지 않는다.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# ================================================================================================
# OBSTACLE DETECTOR CONFIGURATION (Layer 1/2/3 LiDAR obstacle detection)
# ================================================================================================
# LiDAR-only layered obstacle detection with Frenet output. The launch file overrides
# ego_odom_topic based on the `simulator:=` launch argument.
#   Layer 1 [map]     -> filter (remove walls / known static structure), not published
#   Layer 2 [static]  -> /static_obs  (f110_msgs/ObstacleArray, every merged static OBJECT)
#   Layer 2 confirmed -> /confirmed_static_obs (confirmed-only persistent-map input)
#   Layer 3 [dynamic] -> /opp_obs     (f110_msgs/ObstacleArray, <=1 merged opponent, nearest ahead)
# Inside each layer, tracks within layer_merge_gap_s/_d of each other are merged into ONE
# object-level obstacle before publishing (occlusion/corner fragments -> one entry).
# ================================================================================================

obstacle_detector:
  ros__parameters:
    # === ROS INTERFACE ===
    scan_topic: "/scan"                        # LaserScan input (ego)
    global_waypoints_topic: "/global_waypoints"   # f110_msgs/WpntArray (latched) from global_planning
    map_topic: "/map"                          # nav_msgs/OccupancyGrid (latched) from MCL
    ego_odom_topic: "/pf/pose/odom"            # ego pose in map frame (MCL). Sim: /ego_racecar/odom
    static_obs_topic: "/static_obs"            # Layer 2 output (ObstacleArray, is_static=true)
    confirmed_static_obs_topic: "/confirmed_static_obs" # confirmed-only Layer 2 output
    opp_obs_topic: "/opp_obs"                  # Layer 3 output (ObstacleArray, <=1 opponent)
    static_markers_topic: "/static_obs/markers" # RViz mirror of the final /static_obs Frenet bounds
    opp_markers_topic: "/opp_obs/markers"       # RViz mirror of the final /opp_obs Frenet bounds
    map_frame: "map"

    max_range: 14.0                            # ignore returns beyond this (m). Upper bound is the
                                               #   LiDAR itself and min_cluster_points: a 0.3 m
                                               #   obstacle at 14 m subtends ~5 beams at 0.25 deg.

    # === CLUSTERING (adaptive breakpoint detector) ===
    lambda_deg: 10.0                           # min reliable incidence angle (deg)
    cluster_sigma: 0.03                        # LiDAR range noise std (m)
    min_2_points_dist: 0.01                    # floor on the breakpoint threshold (m)
    # 🔴 3 으로 낮추지 말 것 (2026-08-20 실측으로 기각). run_063551 의 120 s 자율 구간을
    # 실제 검출기로 재생해 5 와 3 을 A/B 했다 (같은 스캔·같은 TF·다른 파라미터만):
    #   detection 총량은 3834 -> 10189 (2.7배) 로 늘지만, **진짜 장애물 지점의 검출률은
    #   떨어진다.** 통과 회차 기준 검출률 p50 (검출 1회 이상인 pass 만):
    #     장애물 s=20.39 : 46% -> 27%   s=40.5 : 46% -> 19% (최대 미검출 공백 4.14 -> 8.80 m)
    #   ego odom 을 수리한 조건에서도 같은 방향이었다: s=40.5 41% -> 25% (4.13 -> 6.53 m).
    # 작은 파편 클러스터가 늘면 트래커 연관이 흔들려(euclid_reject 급증) 진짜 장애물의
    # 트랙이 envelope 안정 게이트를 통과하지 못하고 STATIC 으로 승격되지 않는다.
    # 검출 단절의 해법은 이 문턱이 아니다.
    min_cluster_points: 5                      # discard clusters with fewer points
    max_obs_size: 0.8                          # max box size (m); > diagonal of a 0.5x0.5 obstacle
                                               #   (0.707) so car-sized static obstacles pass

    # === PRE-TRACKING FRAGMENT MERGE ===
    # Keep small LiDAR fragments temporarily, then join only when their Cartesian AABBs are close,
    # at least one real point pair is close, and the merged AABB remains <= max_obs_size.
    cluster_merge_enable: true
    cluster_merge_distance: 0.12               # maximum AABB AND real point-pair gap (m)
    cluster_merge_min_fragment_points: 2       # temporary minimum; final cluster still needs 5

    # === ADAPTIVE MEASUREMENT COVARIANCE ===
    # R = base meas_var_s/d * variance_scale. The scale grows for distant, sparse, or
    # high-yaw-rate measurements and is bounded to avoid a bad motion sample freezing updates.
    meas_range_var_scale: 2.0
    meas_sparse_var_scale: 1.5
    meas_yaw_rate_var_scale: 0.25               # set lower/zero when upstream scan is deskewed
    meas_reference_points: 8
    meas_variance_scale_max: 10.0
    meas_motion_timeout: 0.1                    # max scan/odom timestamp difference for yaw rate (s)
    # scan stamp의 TF 조회가 실패하면 최신 TF로 대체하는데, 그건 이 스캔의 점들을 "다른
    # 시각의 자세"로 변환하는 것이라 주행 중이면 클러스터의 map-frame AABB와 Frenet
    # footprint가 통째로 어긋납니다. 그 값이 하류에서는 authoritative 장애물 기하입니다.
    # 대체 TF가 scan stamp에서 이 시간보다 멀면 스캔을 버립니다(왜곡된 기하를 내보내지
    # 않음). 허용 범위 안이어도 throttle WARN을 남깁니다. 0 이하면 대체 자체를 끄고
    # scan-stamp 조회만 사용합니다.
    # 0.05 근거: 10 m/s에서 0.05 s는 0.5 m 편차라 이미 크므로 상한이고, 정상 상황에서는
    # scan-stamp 조회가 성공하므로 이 경로 자체가 드물게 쓰입니다.
    tf_fallback_max_age_sec: 0.05

    # === LAYER 1 FILTERING (map + track boundary + viewing window) ===
    max_viewing_distance: 13.0                 # only consider obstacles up to this far ahead (m);
                                               #   keep it at or below max_range
    view_behind_distance: 1.0                  # small allowance behind ego (m)
    boundaries_inflation: 0.1                  # shrink drivable corridor inward (m) to kill walls
    fallback_track_halfwidth: 1.5              # used when waypoint d_left/d_right are unset (m)
    use_map_filter: true                       # 맵 기반 Layer-1 구조물 제거 사용
    map_occupied_thresh: 50                    # occupancy value considered "occupied"
    # 구조적 벽 필터 (2026-08-13 팀 edge_test 계열 포팅 — 셀 점유 투표 대체):
    # 맵의 점유 셀을 연결 성분으로 묶고 PCA로 "선형(벽)" 성분만 추려 거리변환을 만든 뒤,
    # 벽에서 wall_assoc_distance_m 이내의 빔을 클러스터링 전에 제거한다. 실차의 맵-스캔
    # 불일치(위치추정 오프셋·충돌 후 환경 변화)에서 점유 투표의 양방향 오류를 없앤다.
    # ⚠️ 0.20 복원 (2026-08-14 오전): 0.14 하향 시도는 실차에서 유령 폭풍으로 기각됨 —
    # 장애물 0개 주행(run_0814_1042~1050)에서 MCL 오프셋 max 0.141이 밴드 경계를 넘어
    # 벽 조각이 트랙(수명 최장 13.7 s, 벽여유 0.04~0.28 m)으로 새고, 플래너가 유령을
    # 피하다 반대쪽 벽에 충돌. 0.20은 0813~14 실장애물 4개 백에서 유령 0으로 검증된 값.
    # 벽 인접 박스(벽거리 <0.35) 검출 지연은 이 밴드의 구조적 한계로 남음 — 해법은
    # 밴드 축소가 아니라 MCL 개선(오프셋 p95 < 0.07) 또는 빔별 돌출 구제 로직.
    wall_assoc_distance_m: 0.2                 # 벽 성분에서 이 거리(m) 이내 포인트는 구조물
    # 🔴 wall_linear_ratio 제거 (2026-08-16). 종전에는 성분이 "길쭉한가"(PCA 고유값비 >= 4)를
    # 벽 인정 조건으로 함께 요구했다. 그런데 트랙 경계는 닫힌 고리라 등방적이고 그 검사를
    # 통과할 수 없다 — 실측에서 바깥 경계 성분(점유 셀의 87%)의 비가 1.85로 탈락해 트랙 벽의
    # 87%가 필터에 아예 존재하지 않았고, 헤어핀에서 벽이 매 랩 장애물로 잡혔다.
    # 크기 조건만 남긴다: 26 m짜리 경계는 통과하고, 맵에 구워진 0.3 m짜리 상자는 통과하지
    # 못해 여전히 장애물로 검출된다(게이트의 원래 의도 유지).
    wall_min_length_m: 1.0                     # 벽 인정 최소 주축 길이 (m)

    # === LAYER MERGE (2nd-stage clustering inside each layer) ===
    layer_merge_enable: true                   # merge nearby same-layer tracks into one object
                                               #   (false = per-track publishing, old behaviour)
    layer_merge_gap_s: 0.4                     # [m] max edge-to-edge s-gap between track boxes
    layer_merge_gap_d: 0.3                     # [m] max edge-to-edge d-gap; a passable lateral gap
                                               #   (>= ~0.6 m) between distinct objects never merges

    # === OUTPUT ===
    publish_markers: true                      # publish both Frenet-boundary MarkerArray mirrors
    diagnostics_enable: true                   # emit passive perception diagnostics
    diagnostics_period_sec: 1.0                # wall-clock accumulation window (s, minimum 0.1)
    # 선택된 상대차가 ego corridor와 겹치고 현재/예측 후면 간격이 기준 이내이면
    # obstacle.is_interfering=true로 발행합니다. 검출·추적·동적 분류에는 영향을 주지 않습니다.
    interference_check_enable: true
    interference_distance_m: 1.0               # 간섭 진입 후면 간격 [m]
    interference_distance_margin_ratio: 0.20   # 같은 ID는 1.2 m까지 간섭 유지
    interference_time_horizon_sec: 1.0         # 등속 상대속도 예측 시간 [s]
    interference_min_closing_speed_mps: 0.2    # 이보다 작은 접근 속도는 예측에서 제외
    interference_lateral_margin_m: 0.10        # ego 차폭 밖 추가 횡 안전 여유 [m]
    interference_ego_half_width_m: 0.16        # ego 차체 반폭 [m]
    interference_ego_front_offset_m: 0.25      # ego 기준점부터 전면까지 거리 [m]
    # Deterministic record/replay audit companion stream. It only exposes the already-computed
    # per-scan detections/tracker state and is disabled in production.
    replay_diagnostics_enable: false
    replay_diagnostics_topic: "/cma_replay/detector_events"
    # CMA 전용 exact-stamp odom/scan pairing. Production은 반드시 false를 유지합니다.
    lockstep_mode: false
    lockstep_scan_offset_x_m: 0.275

    # === TRACKING (constant-velocity Kalman, Frenet state [s, vs, d, vd]) ===
    # nhw_ifac 유지 (2026-08-19 가져옴): dbf2a54가 코드 declare_parameter 기본값만
    # 0.002→0.01로 바꾸고 이 YAML을 안 고쳐서, 런치가 YAML을 넘기는 실제 실행에서는
    # 튜닝이 완전히 무효였다. 0.002로 되돌리면 그 회귀가 재발한다.
    # 단위는 분산(m^2)이다 — 0.01은 검출 중심의 표준편차 10 cm 를 뜻하고,
    # 0.002는 4.5 cm 다. 라이다 클러스터 중심의 실제 흔들림을 생각하면 10 cm 쪽이 맞다.
    meas_var_s: 0.01
    meas_var_d: 0.01
    process_var_vs: 2.0
    process_var_vd: 8.0
    assoc_gate: 0.5                            # Frenet association gate (m)
    aggro_multi: 2.0                           # gate multiplier once a track is dynamic
    assoc_use_mahalanobis: true                # second gate after the physical Frenet hard gate
    assoc_mahalanobis_gate: 9.21               # chi-square threshold, 2 DoF, approximately 99%
    # obstacle.id는 Kalman track 수명이나 UNKNOWN/STATIC/DYNAMIC 상태가 아니라 물리 객체를
    # 나타냅니다. 1차 association이 실패해도 같은 Frenet AABB cluster면 motion 상태와 무관하게
    # 기존 object ID에 연결합니다. STATIC으로 안정화된 첫 실측 map AABB를 identity anchor로
    # 고정하고, Kalman track이 폐기돼도 한 랩보다 긴 30초 동안 기억해 Frenet 또는 map AABB가
    # 같은 재검출과 토픽 간 이동에 재사용합니다. CLCS 재생성 시 기억은 초기화됩니다.
    physical_id_reassociation_enable: true
    physical_id_reassociation_gap_s: 0.4       # longitudinal AABB edge gap [m]
    physical_id_reassociation_gap_d: 0.3       # lateral AABB edge gap [m]
    physical_id_reassociation_gap_map: 0.4     # Euclidean map-frame AABB edge gap [m]
    physical_id_memory_sec: 30.0               # dormant confirmed-object ID memory [s]
    # 🔴 TTL은 frame 단위라 250 Hz 시뮬에서 아주 짧습니다. 40 frame = 0.16 s였고, 코너에서
    # 상대차가 그보다 조금만 가려져도 dynamic track이 죽어 /opp_obs가 비었습니다. 그러면
    # cruise_controller가 clear_confirm_sec(1.0) 뒤 속도 상한을 maximum_speed로 완전히 풀어
    # 코너 안에서 상대차를 향해 가속합니다. 125 frame = 0.5 s로 차폐를 버팁니다.
    # 정적 track에는 시간 기반 static_lost_hold_sec가 따로 있으므로 이 값은 static 판정과
    # 무관합니다 — 분류 임계값이 아니라 "잃은 dynamic track을 얼마나 붙잡나"입니다.
    # 미관측 dynamic track은 Cartesian AABB를 발행하지 않고(is_visible=false) Frenet s/vs
    # 예측만 싣습니다. state_machine의 간섭 술어는 진입에 is_visible을 요구하고 래치 유지만
    # 예측 프레임에 허용하므로(고스트 게이트) 이 TTL이 유령 진입을 만들지 않습니다.
    ttl_dynamic: 125                           # frames to keep a lost dynamic track (~0.5 s @250 Hz)
    ttl_static: 25                             # keep a lost static track for ~0.1 s at 250 Hz
    # CONFIRMED STATIC track은 맵 고정 물체라서 시야 상실(차폐·FOV 이탈·제동 노즈다이브)이
    # 소멸의 증거가 아닙니다. 스캔 stamp 기준으로 이 시간 동안 트랙과 발행 자격(envelope
    # 안정 streak 포함)을 유지합니다. 0이면 기존 frame-TTL 즉시 retire로 복귀.
    # 2026-08-12 21:11 run: 0.1 s retire→근거리 respawn이 헤어핀 zero-hold 완전정지 5회와
    # 직선 경로 churn(91 s 동안 fresh 재선택 80회)의 공통 원인이었음.
    static_lost_hold_sec: 5.0
    # Track 존재 신뢰도와 motion 분류는 독립입니다. 최근 5 scan 중 association된 measurement가
    # 3회 이상이어야 CONFIRMED가 되며, RAW/TENTATIVE track은 어떤 장애물 토픽에도 싣지 않습니다.
    min_hits_confirm: 3
    confirmation_window: 5
    # 스캔마다 달라지는 AABB extent(정사각형 박스 vs 실제 형태 괴리)를 magnitude 기준으로
    # 완화합니다. 확장은 즉시, 축소는 ~1/alpha 프레임에 걸쳐 서서히. 1.0이면 기존 덮어쓰기.
    extent_shrink_alpha: 0.25
    # 정적 레이어 발행 안정성 게이트: 측정 중심과 envelope가 tolerance 이내로 안정된 연속
    # 프레임 수를 요구합니다. 형태가 계속 변하는 부채꼴 산란 클러스터는 발행되지 않으며,
    # 안정적인 실제 장애물은 min_hits_confirm과 같은 시점에 통과해 추가 지연이 없습니다.
    envelope_stability_tolerance_m: 0.10
    envelope_stability_frames: 2
    # false: static_lost_hold_sec 동안 시야를 잃은 CONFIRMED STATIC track도 마지막 실측
    # 지오메트리(맵 고정이므로 여전히 유효)로 /static_obs, /confirmed_static_obs에 계속
    # 발행합니다. true였을 때는 차폐 1프레임에도 장애물이 토픽에서 사라져 플래너가
    # blocking↔clear를 반복(zero-hold 정지, 커밋 무효화)했습니다.
    static_publish_requires_visible: false
    # static_lost_hold_sec의 근거는 "안 보이면 차폐된 것이고, 맵 고정 물체는 차폐 중에도
    # 그대로다"입니다. 그런데 스캔이 그 상자를 **관통해서** 더 먼 곳의 반사를 받고 있으면
    # 그 공간이 비었다는 적극적 증거이고, 홀드는 뻔히 보이는 자리에 유령을 5초간 살려두는
    # 장치가 됩니다(플래너는 그동안 계속 회피하고 state_machine은 AVOID를 유지).
    # 반증 조건(전부 만족해야 1프레임 인정):
    #   - 광선이 마지막 실측 map AABB를 box_shrink_m만큼 줄인 **코어**를 관통할 것
    #     (실제 물체는 AABB를 꽉 채우지 않으므로 모서리를 스치는 빔은 세지 않음)
    #   - 그 광선의 **유한한** 반사거리가 코어 뒤쪽 면보다 margin_m 이상 멀 것
    #     (무반사 inf는 흡수면·최대거리 초과와 구분되지 않으므로 증거로 쓰지 않음)
    #   - 그런 빔이 min_beams개 이상일 것
    # 이 조건이 frames 스캔 연속으로 성립하면 track을 즉시 회수합니다. 차폐(빔이 상자 앞에서
    # 멈춤)나 벽 필터로 포인트가 지워진 경우는 관통 증거가 없으므로 홀드가 그대로 유지됩니다.
    static_hold_freespace_refute_enable: true
    static_hold_freespace_refute_frames: 3      # 연속 반증 스캔 수 (0이면 반증 비활성)
    static_hold_freespace_refute_min_beams: 3   # 한 스캔에서 필요한 관통 빔 수
    static_hold_freespace_refute_margin_m: 0.15 # 뒤쪽 면을 이만큼 지나야 관통으로 인정 [m]
    static_hold_freespace_refute_box_shrink_m: 0.05  # 코어 상자 축소량 (각 면) [m]

    # === 후방 사각 회수 (2026-08-22 신설) ===
    # 위 free-space 반증은 "상자를 관통한 빔"을 증거로 쓰므로 **상자가 시야 안에 있을 때만**
    # 성립합니다. 차 뒤로 넘어간 상자에는 쏠 빔이 아예 없어 반증이 원리적으로 불가능하고,
    # hold가 static_lost_hold_sec(5초)를 끝까지 채웁니다. 그 구간의 hold는 정보가 0입니다 —
    # 어떤 미래 스캔도 그 트랙에 측정을 붙일 수 없으므로 증거로 갱신될 길이 없고, 타이머로
    # 죽는 결말만 남습니다. 그래서 마지막 실측 map AABB가 **통째로** 스캐너 FOV 밖으로
    # 넘어간 것이 연속 frames회 확인되면 그 스캔에서 바로 회수합니다.
    #
    # 🔑 상수가 없습니다 — FOV는 /scan 헤더의 angle_min/angle_max를 그대로 씁니다(실차 ±135°,
    #    1081빔). 라이다를 바꾸면 판정도 따라갑니다. 360° 스캐너는 사각이 없으므로 no-op입니다.
    # 🔑 봉투의 **네 꼭짓점이 전부** 밖일 때만 회수합니다. 하나라도 보이면 차폐일 수 있으므로
    #    hold를 그대로 둡니다. 즉 전방 차폐 hold(2026-08-12 churn 수정)는 건드리지 않습니다.
    #
    # 실측 근거 (run_20260821_230603, 자율 128 s / 장애물 7랩):
    #   - /static_obs 엔트리 7811개 중 ego 뒤 4770개(61.1%), 그중 92.0%가 후방 사각
    #   - 뒤쪽 거리 median 5.20 m — 경계가 애매한 값이 아니라 한참 뒤
    #   - 안전정지 8회 23.6 s(자율의 18%) 중 긴 3건(5.63/5.69/5.66 s)이 전부 이 유령이
    #     사라진 0.22 s 뒤(= safe_stop_release_cycles 8 ÷ 39 Hz)에 해제됨. 그동안 차는
    #     ±0.01 m로 완전 정지해 있었으므로 바뀐 입력은 장애물 목록뿐이었다.
    # 되돌리기: static_hold_rear_blind_retire_enable: false (비트 단위로 종전 거동)
    static_hold_rear_blind_retire_enable: true
    static_hold_rear_blind_retire_frames: 3     # 연속 확인 스캔 수 (0이면 비활성)
    # 경계에서 깜빡이지 않도록 FOV를 이만큼 **넓혀서** 판정합니다(= 회수에 보수적) [deg]
    static_hold_rear_blind_retire_margin_deg: 2.0

    # === MAP-FRAME MOTION CLASSIFICATION ===
    # 기존 Frenet KF/association은 유지하고, 각 track에 분류 전용 map-frame CV KF
    # [x,vx,y,vy]를 병렬로 둡니다. Tv=vᵀ Pv⁻¹v는 inverse 대신 Eigen LDLT solve로 계산합니다.
    # CONFIRMED+UNKNOWN은 안전을 위해 provisional 객체로 /static_obs에 남지만,
    # /confirmed_static_obs에는 STATIC만 들어갑니다.
    motion_classification:
      dynamic_chi2_threshold: 9.21             # Tv가 이 값보다 크면 dynamic evidence
      static_chi2_threshold: 5.99              # Tv가 이 값보다 작으면 static evidence
      frenet_dynamic_chi2_threshold: 6.63      # 1-DoF Ts, 99% chi-square (dynamic 전용)

      dynamic_vote_window: 5                   # 최근 유효 measurement evidence window
      dynamic_vote_required: 3                 # 5개 중 dynamic 3개면 DYNAMIC
      # B2-② STATIC 승격 완화 (2026-08-20). 10/15표+관측 10은 raw→confirmed 지연의
      # 주범이었다: 가시율 26% 장애물(run_192006 id7)이 1.27 s, 그 사이 5.8 m 를 그대로
      # 달렸고, 승격이 아예 무산된 채 통과한 패스가 run_080532 에서 14/107 이었다.
      # 6표/관측 6이면 완전 가시에서 0.24 s, 26% 가시에서 ~0.9 s. 반대쪽 오분류 방어는
      # 그대로다: DYNAMIC 판정은 3/5표 + 실측 병진 dynamic_min_translation_m 증명이
      # 따로 있고, STATIC 은 여전히 map RMS<0.10 을 동시에 요구한다.
      static_vote_window: 12
      static_vote_required: 6                  # 위치 지속성도 동시에 만족해야 STATIC

      position_history_size: 15                # prediction이 아닌 map filtered positions
      static_min_observations: 6               # B2-②: 표와 같은 6으로 (10이면 표 완화가 무효)
      static_max_position_rms: 0.10            # map 위치 RMS [m]

      # 🔴 위 두 줄을 포함해 STATIC 진입 조건은 전부 "프레임 수"였습니다. gym 브리지 스캔이
      # 250 Hz(`create_timer(0.004)`)라 15프레임 = 60 ms이고, 그 사이 갓 생성된 track은 아직
      # 초기값 v=0을 들고 있어 Tv≈0 → static evidence가 쏟아집니다. 위치 RMS도 60 ms 이동분
      # (2 m/s에서 3.5 cm)이라 0.10 m 제한에 전혀 걸리지 않습니다. 그 결과 상대차가 track 생성
      # 44 ms 만에 STATIC으로 확정돼 /confirmed_static_obs로 나갔습니다 (2026-08-20 2-agent 실측).
      #
      # 그래서 STATIC 진입에 시간 조건을 겁니다. 현재 motion status를 이 시간만큼 유지해야
      # 하며, translation_window_sec(0.20)보다 커야 아래 two-edge 병진 증거가 창을 다 채운 뒤에
      # 판정됩니다. 추가로 그 증거가 "병진하지 않았다"(< dynamic_min_translation_m)고 말해야
      # STATIC이 됩니다 — DYNAMIC 진입에 쓰는 증거를 반대 방향으로 읽는 것입니다.
      # 정적 장애물은 이 시간 동안 provisional로 /static_obs에 계속 실리므로 안전 측입니다.
      static_min_observation_sec: 0.25

      # 한 번 DYNAMIC이 된 track은 잠깐 멈춰도 곧바로 STATIC으로 돌아가지 않습니다.
      dynamic_to_static_min_observations: 20
      dynamic_to_static_vote_required: 12      # 계약: static_vote_window 이하 (전창 만장일치 유지)
      dynamic_to_static_max_position_rms: 0.08

      covariance_regularization_epsilon: 1.0e-6
      minimum_velocity_covariance: 1.0e-5
      static_score_forgetting_factor: 0.95

      # 코너 뒤에 가려진 정적 장애물은 접근하면서 조금씩 드러나고, 그동안 측정 AABB가
      # 자라며 중심이 수 cm 이동합니다. map KF는 이를 속도로 읽어 Tv가 커지고 track이
      # DYNAMIC으로 오분류되면 /static_obs에서 사라져 planner가 장애물을 놓칩니다.
      # 상자가 "실제로 이동했다"고 증명되는 양은 map AABB와 Frenet envelope 각각에서 한 축의
      # 두 edge가 같은 방향으로 함께 움직인 크기뿐입니다(한쪽만 움직이면 이동이 아니라
      # 성장/축소). 둘 중 큰 증명이
      # dynamic_min_translation_m에 못 미치면 chi2가 커도 dynamic vote를 주지 않고
      # Uncertain으로 남깁니다. Track은 UNKNOWN을 유지해 /static_obs에 계속 실립니다.
      # Frenet 증명은 코너에서 차량 자세 회전 때문에 map AABB 폭/높이가 변해 병진량이
      # 상쇄되는 문제를 막고, 동일한 two-edge 규칙이라 부분 노출 정적 물체 보호도 유지합니다.
      # 이 게이트는 DYNAMIC 진입만 어렵게 하며, 실제 상대 차량은 window 동안 충분히
      # 병진하므로 그대로 통과합니다.
      #
      # 🔴 two-edge 규칙은 여기 vote 게이트에만 씁니다. 이 규칙으로 누적한 값을 map KF의
      # 측정값으로 쓰는 방식은 2026-08-20 되돌렸습니다 — min(|Δmin|,|Δmax|)는 0쪽으로 편향된
      # 추정량이라 cm급 edge 잡음에서 실제 속도를 25~50% 낮게 읽었고(저속일수록·스캔이
      # 빠를수록 악화), 재앵커링이 없는 순수 적분기라 pose 지터에 random walk로 표류했습니다.
      translation_corroboration_enable: true
      translation_window_sec: 0.20        # 증명 구간 [s]. 스캔 주기에 따라 샘플 수가 정해짐
      translation_history_max_samples: 64 # window 내 보관 AABB 최대 개수 (메모리 상한)
      # 0.18 m / 0.2 s = 0.9 m/s. 0.30이던 시절(2026-08-20 이전, 08-22 포팅으로 잠시
      # 되돌아왔던 값)은 1.5 m/s를 요구해 코너 감속 중이거나 저속인 상대차가 원리적으로
      # DYNAMIC이 될 수 없었고, 그러면 /opp_obs가 비어 CRUISE 자체가 성립하지 않습니다.
      # MCL 점프(양 에지 동시 이동, run_0814_010624 t=317 id42) 대책은 임계값 상향이 아니라
      # 아래 지속성 조건으로 분리했습니다 — 점프는 창 안에 점프 이전 샘플이 남아 있는
      # translation_window_sec 동안만 병진을 증명하고 그 뒤 ~0으로 무너지지만, 실제로 움직이는
      # 물체는 계속 증명합니다. 그래서 "창보다 오래 유지"가 둘을 가르는 조건입니다.
      # persistence는 프레임 수가 아니라 시간이므로 스캔 주기에 무관합니다.
      #
      # ╔══ 🔵 값 근거 — 되돌리기 전에 읽을 것 (2026-08-24 개정) ═════════════════╗
      # ║ 0.18 = 0.2 s 창에서 0.9 m/s. 0.30 은 1.5 m/s 를 요구한다.               ║
      # ║                                                                        ║
      # ║ 🔴 이 브랜치는 CRUISE 를 쓰므로 **0.18 이다**(2026-08-24 이식).           ║
      # ║ 0.30 이면 감속하며 코너에 진입하는 상대차가 DYNAMIC 이 되지 못해           ║
      # ║ /opp_obs 가 비고, 상태머신의 간섭 술어가 볼 대상이 없어 CRUISE 가 아예     ║
      # ║ 걸리지 않는다. 예전 주석은 "이 브랜치는 /opp_obs 를 안 쓰니 완화 이득이    ║
      # ║ 0"이라는 근거로 0.30 을 강제했는데, 그 전제가 사라졌다.                    ║
      # ║                                                                        ║
      # ║ 반대편 위험(문턱을 낮추면 정적 박스가 위치추정 지터로 DYNAMIC 표를 받아     ║
      # ║ /confirmed_static_obs 에서 이탈)은 실재한다 — run_0814_010624 t=317      ║
      # ║ id42. 그래서 실측으로 마진을 확인했다.                                    ║
      # ║                                                                        ║
      # ║ 실측 (2026-08-23, 백 3개 / 정적 박스 two-edge 병진 증명 0.2 s 창):        ║
      # ║   run_0823_003418 n=1012  p99 0.135  최대 0.169  → 0.18 초과 0.00%      ║
      # ║   run_0823_003748 n=1916  p99 0.133  최대 0.181  → 0.18 초과 0.05%      ║
      # ║   run_0822_073013 n=3678  p99 0.101  최대 0.458  → 0.18 초과 0.35%      ║
      # ║ 0.30 에서는 각각 0.00 / 0.00 / 0.14%. 0.18 의 오분류율은 최악 0.35% 이고  ║
      # ║ 그마저 dynamic_translation_persistence_sec(0.30) 이 한 번 더 거른다.     ║
      # ║                                                                        ║
      # ║ ⚠️ 이 값은 CRUISE 활성화 3요소 중 하나다. 나머지 둘은 state_machine 의     ║
      # ║ allow_cruise_transition 과 f1tenth_control 런치의 cruise_enable 이며,    ║
      # ║ 셋은 항상 같이 켜고 같이 끈다(f1tenth_control test_cruise_contract.py).  ║
      # ╚════════════════════════════════════════════════════════════════════════╝
      dynamic_min_translation_m: 0.18     # window 내 증명된 병진이 이 값 미만이면 vote 보류
      # translation_window_sec(0.20)보다 커야 1회성 점프를 걸러냅니다. 0이면 비활성.
      dynamic_translation_persistence_sec: 0.30

      # 급제동·런치킥 순간에는 위치추정 자체가 흔들려 모든 track이 map frame에서 병진한
      # 것처럼 보입니다(2026-08-12 21:11 run: 정지/재출발 시각마다 STATIC track이 DYNAMIC
      # blip으로 /static_obs에서 사라짐). ego odom twist의 평활 가속도가 임계값을 넘으면
      # 그 스파이크 이후 hold 시간 동안 dynamic vote만 보류합니다. static vote와 나머지
      # 갱신은 그대로 진행되므로 실제 상대 차량의 DYNAMIC 진입이 hold만큼만 늦어집니다.
      # 0.0이면 비활성.
      dynamic_vote_ego_accel_suppress_mps2: 2.0
      dynamic_vote_suppress_hold_sec: 0.5
      ego_accel_smoothing_sec: 0.15       # 가속도 지수 평활 시정수 [s]

      # 모든 confirmed track의 status, map velocity, Tv, vote, RMS, confidence, 마지막
      # measurement 경과시간을 한 로그로 throttle해 출력합니다.
      debug_enable: false
      debug_period_sec: 1.0

    dt_max: 0.5                                # clamp for the Kalman prediction step (s)
