# ================================================================================================
# OBSTACLE DETECTOR 설정(계층 1/2/3 LiDAR 장애물 검출)
# ================================================================================================
# LiDAR만 사용해 계층형 장애물을 검출하고 Frenet 좌표로 출력한다. launch 파일은
# `simulator:=` 인자에 따라 ego_odom_topic을 덮어쓴다.
#   계층 1 [map]     -> 벽과 알려진 정적 구조물을 제거하는 필터이며 발행하지 않음
#   계층 2 [static]  -> /static_obs(병합된 모든 정적 물체를 f110_msgs/ObstacleArray로 발행)
#   계층 3 [dynamic] -> /opp_obs(병합 후 가장 가까운 전방 상대를 최대 1개 발행)
# 같은 계층에서 layer_merge_gap_s/_d 안에 있는 트랙들은 발행 전에 물체 하나로 합친다.
# 따라서 가림이나 모서리 반사로 생긴 파편도 배열 항목 하나로 출력된다.
# ================================================================================================

obstacle_detector:
  ros__parameters:
    # === ROS 인터페이스 ===
    scan_topic: "/scan"                        # 자차 LaserScan 입력
    global_waypoints_topic: "/global_waypoints"   # global_planning의 latched WpntArray
    map_topic: "/map"                          # MCL의 latched OccupancyGrid
    ego_odom_topic: "/pf/pose/odom"            # map 좌표 자차 자세, 시뮬레이터: /ego_racecar/odom
    static_obs_topic: "/static_obs"            # 계층 2 출력(ObstacleArray, is_static=true)
    opp_obs_topic: "/opp_obs"                  # 계층 3 출력(상대 차량 최대 1개)
    static_markers_topic: "/static_obs/markers" # 최종 /static_obs Frenet 경계의 RViz 복제본
    opp_markers_topic: "/opp_obs/markers"       # 최종 /opp_obs Frenet 경계의 RViz 복제본
    map_frame: "map"

    max_range: 14.0                            # 이 거리[m] 이상의 반사점은 무시한다. 상한은
                                               # LiDAR와 min_cluster_points로 결정되며, 0.25도
                                               # 해상도에서 14 m 거리의 0.3 m 물체는 약 5 beam이다.

    # === 적응형 BREAKPOINT 군집화 ===
    lambda_deg: 10.0                           # 신뢰 가능한 최소 입사각[deg]
    cluster_sigma: 0.03                        # LiDAR 거리 잡음 표준편차[m]
    min_2_points_dist: 0.01                    # breakpoint 임계 거리의 하한[m]
    min_cluster_points: 5                      # 이 점 수보다 작은 최종 군집은 제거
    max_obs_size: 0.8                          # 최대 상자 대각선[m], 0.5 x 0.5 m 장애물의
                                               # 대각선 0.707 m보다 커서 차량 크기 물체를 허용한다.

    # === 추적 전 파편 병합 ===
    # 작은 LiDAR 파편을 잠시 보존한다. Cartesian AABB가 가깝고 실제 점 쌍 하나 이상도 가까우며
    # 합친 AABB가 max_obs_size 이하일 때만 병합한다.
    cluster_merge_enable: true
    cluster_merge_distance: 0.12               # AABB와 실제 점 쌍 모두에 적용할 최대 간격[m]
    cluster_merge_min_fragment_points: 2       # 임시 최소 점 수이며 최종 군집은 여전히 5점 필요

    # === 적응형 측정 공분산 ===
    # R = 기본 meas_var_s/d * variance_scale이다. 멀고 성기거나 yaw rate가 큰 측정일수록
    # 배율이 커진다. 잘못된 motion 표본 하나가 갱신을 멈추지 않도록 최대 배율을 제한한다.
    meas_range_var_scale: 2.0
    meas_sparse_var_scale: 1.5
    meas_yaw_rate_var_scale: 0.25               # 상위 노드에서 deskew했다면 낮추거나 0으로 설정
    meas_reference_points: 8
    meas_variance_scale_max: 10.0
    meas_motion_timeout: 0.1                    # yaw rate 사용을 허용할 scan/odom 최대 시각차[s]

    # === 계층 1 필터(map + 트랙 경계 + 가시 구간) ===
    max_viewing_distance: 13.0                 # 이 전방 거리[m]까지만 장애물을 고려하며
                                               # max_range 이하로 유지한다.
    view_behind_distance: 1.0                  # 자차 후방에 허용할 작은 여유 거리[m]
    boundaries_inflation: 0.1                  # 벽 제거를 위해 주행 가능 영역을 안쪽으로 축소[m]
    fallback_track_halfwidth: 1.5              # waypoint 좌우 경계가 없을 때 쓸 기본 반폭[m]
    use_map_filter: true                       # /map의 알려진 정적 구조물 위 군집 제거
    map_occupied_thresh: 50                    # 점유 셀로 판단할 occupancy 최솟값
    map_inflation_cells: 1                     # 지도 검사에 포함할 주변 셀 반경
    map_point_reject_ratio: 0.6                # 지도 위 점 비율이 이 값 이상이면 군집 제거

    # === 계층 병합(같은 계층 안의 2차 군집화) ===
    layer_merge_enable: true                   # 가까운 같은 계층 트랙을 물체 하나로 병합
                                               # false이면 기존처럼 트랙별로 발행한다.
    layer_merge_gap_s: 0.4                     # 트랙 상자 모서리 사이 최대 s 간격[m]
    layer_merge_gap_d: 0.3                     # 최대 d 간격[m], 서로 다른 물체 사이의 통과 가능한
                                               # 약 0.6 m 이상 횡간격은 병합하지 않는다.

    # === 출력 ===
    publish_markers: true                      # 두 Frenet 경계 MarkerArray 복제본 발행
    diagnostics_enable: true                   # 인지 동작에 영향 없는 수동 진단 로그 출력
    diagnostics_period_sec: 1.0                # wall clock 누적 구간[s], 최솟값 0.1

    # === 추적(등속 Kalman, Frenet 상태 [s, vs, d, vd]) ===
    meas_var_s: 0.002
    meas_var_d: 0.002
    process_var_vs: 2.0
    process_var_vd: 8.0
    assoc_gate: 0.5                            # 물리적 Frenet 연관 거리 게이트[m]
    aggro_multi: 2.0                           # 동적 트랙의 연관 게이트 확대 배율
    assoc_use_mahalanobis: true                # 물리 거리 게이트 뒤에 2차 Mahalanobis 게이트 사용
    assoc_mahalanobis_gate: 9.21               # 자유도 2, 약 99% 카이제곱 임계값
    ttl_dynamic: 40                            # 미관측 동적 트랙을 유지할 프레임 수
    ttl_static: 25                             # 250 Hz 기준 미관측 정적 트랙을 약 0.1초 유지
    min_hits_confirm: 3                        # 트랙을 발행하기 전에 필요한 측정 수

    # === 계층 2/계층 3 분류(map-flow 기준 대비 흐름) ===
    # 벽과 정지 장애물은 자차에 대해 map-flow 속도로 흐르며, 저속 트랙의 평균으로 이를 측정한다.
    # map과 함께 흐르는 트랙은 계층 2(정적), 이 기준에서 명확히 벗어나 흐르는 같은 방향 상대
    # 차량은 계층 3(동적)으로 분류한다.
    classifier_mode: "velocity"                # "velocity" | "std" | "both"
    dyn_vel_enter: 0.5                         # map-flow 대비 이 속도차 이상이면 동적[m/s]
    dyn_vel_exit: 0.25                         # 이 속도차 미만이면 정적 복귀[m/s], 히스테리시스
    static_confirm_frames: 3                   # 임시 상태 뒤 필요한 연속 저속 관측 수
    dynamic_confirm_frames: 25                 # 동적 승격에 필요한 연속 신뢰 움직임 관측 수
    dyn_velocity_mahalanobis_gate: 9.21        # 속도 신뢰도, 자유도 2 약 99% 카이제곱
    dyn_max_abs_yaw_rate: 1.5                  # 이 자차 회전률 이상에서는 움직임 증거 미누적[rad/s]
    static_ref_gate: 0.3                       # 이보다 느린 트랙으로 map-flow를 계산하고
                                               # 벽·정지 물체는 포함하되 상대 차량은 제외한다[m/s].
    std_window: 30                             # 표준편차 분류에 사용할 위치 이력 길이
    min_nb_meas: 5                             # 표준편차 분류가 투표하기 위한 최소 측정 수
    min_std: 0.16                              # 두 축 모두 이 값 미만이면 정적 투표[m]
    max_std: 0.20                              # 어느 축이든 이 값 초과면 동적 투표[m]
    dt_max: 0.5                                # Kalman 예측 시간 간격 상한[s]
