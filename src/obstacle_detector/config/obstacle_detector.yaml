# ================================================================================================
# OBSTACLE DETECTOR CONFIGURATION (Layer 1/2/3 LiDAR obstacle detection)
# ================================================================================================
# LiDAR-only layered obstacle detection with Frenet output. The launch file overrides
# ego_odom_topic based on the `simulator:=` launch argument.
#   Layer 1 [map]     -> filter (remove walls / known static structure), not published
#   Layer 2 [static]  -> /static_obs  (f110_msgs/ObstacleArray, every merged static OBJECT)
#   Layer 2 confirmed -> /confirmed_static_obs (confirmed-only persistent-map input)
#   Layer 3 [dynamic] -> /opp_obs     (f110_msgs/ObstacleArray, <=1 merged opponent, nearest ahead)
# Inside each layer, tracks within layer_merge_gap_s/_d of each other are merged into ONE
# object-level obstacle before publishing (occlusion/corner fragments -> one entry).
# ================================================================================================

obstacle_detector:
  ros__parameters:
    # === ROS INTERFACE ===
    scan_topic: "/scan"                        # LaserScan input (ego)
    global_waypoints_topic: "/global_waypoints"   # f110_msgs/WpntArray (latched) from global_planning
    map_topic: "/map"                          # nav_msgs/OccupancyGrid (latched) from MCL
    ego_odom_topic: "/pf/pose/odom"            # ego pose in map frame (MCL). Sim: /ego_racecar/odom
    static_obs_topic: "/static_obs"            # Layer 2 output (ObstacleArray, is_static=true)
    confirmed_static_obs_topic: "/confirmed_static_obs" # confirmed-only Layer 2 output
    opp_obs_topic: "/opp_obs"                  # Layer 3 output (ObstacleArray, <=1 opponent)
    static_markers_topic: "/static_obs/markers" # RViz mirror of the final /static_obs Frenet bounds
    opp_markers_topic: "/opp_obs/markers"       # RViz mirror of the final /opp_obs Frenet bounds
    map_frame: "map"

    max_range: 14.0                            # ignore returns beyond this (m). Upper bound is the
                                               #   LiDAR itself and min_cluster_points: a 0.3 m
                                               #   obstacle at 14 m subtends ~5 beams at 0.25 deg.

    # === CLUSTERING (adaptive breakpoint detector) ===
    lambda_deg: 10.0                           # min reliable incidence angle (deg)
    cluster_sigma: 0.03                        # LiDAR range noise std (m)
    min_2_points_dist: 0.01                    # floor on the breakpoint threshold (m)
    min_cluster_points: 5                      # discard clusters with fewer points
    max_obs_size: 0.8                          # max box size (m); > diagonal of a 0.5x0.5 obstacle
                                               #   (0.707) so car-sized static obstacles pass

    # === PRE-TRACKING FRAGMENT MERGE ===
    # Keep small LiDAR fragments temporarily, then join only when their Cartesian AABBs are close,
    # at least one real point pair is close, and the merged AABB remains <= max_obs_size.
    cluster_merge_enable: true
    cluster_merge_distance: 0.12               # maximum AABB AND real point-pair gap (m)
    cluster_merge_min_fragment_points: 2       # temporary minimum; final cluster still needs 5

    # === ADAPTIVE MEASUREMENT COVARIANCE ===
    # R = base meas_var_s/d * variance_scale. The scale grows for distant, sparse, or
    # high-yaw-rate measurements and is bounded to avoid a bad motion sample freezing updates.
    meas_range_var_scale: 2.0
    meas_sparse_var_scale: 1.5
    meas_yaw_rate_var_scale: 0.25               # set lower/zero when upstream scan is deskewed
    meas_reference_points: 8
    meas_variance_scale_max: 10.0
    meas_motion_timeout: 0.1                    # max scan/odom timestamp difference for yaw rate (s)

    # === LAYER 1 FILTERING (map + track boundary + viewing window) ===
    max_viewing_distance: 13.0                 # only consider obstacles up to this far ahead (m);
                                               #   keep it at or below max_range
    view_behind_distance: 1.0                  # small allowance behind ego (m)
    boundaries_inflation: 0.1                  # shrink drivable corridor inward (m) to kill walls
    fallback_track_halfwidth: 1.5              # used when waypoint d_left/d_right are unset (m)
    use_map_filter: true                       # drop clusters on known static structure (/map)
    map_occupied_thresh: 50                    # occupancy value considered "occupied"
    map_inflation_cells: 1                     # neighbourhood radius (cells) for the map check
    map_point_reject_ratio: 0.6                # drop cluster if this fraction of points are on map

    # === LAYER MERGE (2nd-stage clustering inside each layer) ===
    layer_merge_enable: true                   # merge nearby same-layer tracks into one object
                                               #   (false = per-track publishing, old behaviour)
    layer_merge_gap_s: 0.4                     # [m] max edge-to-edge s-gap between track boxes
    layer_merge_gap_d: 0.3                     # [m] max edge-to-edge d-gap; a passable lateral gap
                                               #   (>= ~0.6 m) between distinct objects never merges

    # === OUTPUT ===
    publish_markers: true                      # publish both Frenet-boundary MarkerArray mirrors
    diagnostics_enable: true                   # emit passive perception diagnostics
    diagnostics_period_sec: 1.0                # wall-clock accumulation window (s, minimum 0.1)

    # === TRACKING (constant-velocity Kalman, Frenet state [s, vs, d, vd]) ===
    meas_var_s: 0.002
    meas_var_d: 0.002
    process_var_vs: 2.0
    process_var_vd: 8.0
    assoc_gate: 0.5                            # Frenet association gate (m)
    aggro_multi: 2.0                           # gate multiplier once a track is dynamic
    assoc_use_mahalanobis: true                # second gate after the physical Frenet hard gate
    assoc_mahalanobis_gate: 9.21               # chi-square threshold, 2 DoF, approximately 99%
    # obstacle.id는 Kalman track 수명이나 UNKNOWN/STATIC/DYNAMIC 상태가 아니라 물리 객체를
    # 나타냅니다. 1차 association이 실패해도 같은 Frenet AABB cluster면 motion 상태와 무관하게
    # 기존 object ID에 연결합니다. STATIC으로 안정화된 첫 실측 map AABB를 identity anchor로
    # 고정하고, Kalman track이 폐기돼도 한 랩보다 긴 30초 동안 기억해 Frenet 또는 map AABB가
    # 같은 재검출과 토픽 간 이동에 재사용합니다. CLCS 재생성 시 기억은 초기화됩니다.
    physical_id_reassociation_enable: true
    physical_id_reassociation_gap_s: 0.4       # longitudinal AABB edge gap [m]
    physical_id_reassociation_gap_d: 0.3       # lateral AABB edge gap [m]
    physical_id_reassociation_gap_map: 0.4     # Euclidean map-frame AABB edge gap [m]
    physical_id_memory_sec: 30.0               # dormant confirmed-object ID memory [s]
    ttl_dynamic: 40                            # frames to keep a lost dynamic track
    ttl_static: 25                             # keep a lost static track for ~0.1 s at 250 Hz
    # Track 존재 신뢰도와 motion 분류는 독립입니다. 최근 5 scan 중 association된 measurement가
    # 3회 이상이어야 CONFIRMED가 되며, RAW/TENTATIVE track은 어떤 장애물 토픽에도 싣지 않습니다.
    min_hits_confirm: 3
    confirmation_window: 5
    # 스캔마다 달라지는 AABB extent(정사각형 박스 vs 실제 형태 괴리)를 magnitude 기준으로
    # 완화합니다. 확장은 즉시, 축소는 ~1/alpha 프레임에 걸쳐 서서히. 1.0이면 기존 덮어쓰기.
    extent_shrink_alpha: 0.25
    # 정적 레이어 발행 안정성 게이트: 측정 중심과 envelope가 tolerance 이내로 안정된 연속
    # 프레임 수를 요구합니다. 형태가 계속 변하는 부채꼴 산란 클러스터는 발행되지 않으며,
    # 안정적인 실제 장애물은 min_hits_confirm과 같은 시점에 통과해 추가 지연이 없습니다.
    envelope_stability_tolerance_m: 0.10
    envelope_stability_frames: 2

    # === MAP-FRAME MOTION CLASSIFICATION ===
    # 기존 Frenet KF/association은 유지하고, 각 track에 분류 전용 map-frame CV KF
    # [x,vx,y,vy]를 병렬로 둡니다. Tv=vᵀ Pv⁻¹v는 inverse 대신 Eigen LDLT solve로 계산합니다.
    # CONFIRMED+UNKNOWN은 안전을 위해 provisional 객체로 /static_obs에 남지만,
    # /confirmed_static_obs에는 STATIC만 들어갑니다.
    motion_classification:
      dynamic_chi2_threshold: 9.21             # Tv가 이 값보다 크면 dynamic evidence
      static_chi2_threshold: 5.99              # Tv가 이 값보다 작으면 static evidence

      dynamic_vote_window: 5                   # 최근 유효 measurement evidence window
      dynamic_vote_required: 3                 # 5개 중 dynamic 3개면 DYNAMIC
      static_vote_window: 15
      static_vote_required: 10                 # 위치 지속성도 동시에 만족해야 STATIC

      position_history_size: 15                # prediction이 아닌 map filtered positions
      static_min_observations: 10
      static_max_position_rms: 0.10            # map 위치 RMS [m]

      # 한 번 DYNAMIC이 된 track은 잠깐 멈춰도 곧바로 STATIC으로 돌아가지 않습니다.
      dynamic_to_static_min_observations: 20
      dynamic_to_static_vote_required: 15
      dynamic_to_static_max_position_rms: 0.08

      covariance_regularization_epsilon: 1.0e-6
      minimum_velocity_covariance: 1.0e-5
      static_score_forgetting_factor: 0.95

      # 모든 confirmed track의 status, map velocity, Tv, vote, RMS, confidence, 마지막
      # measurement 경과시간을 한 로그로 throttle해 출력합니다.
      debug_enable: false
      debug_period_sec: 1.0

    dt_max: 0.5                                # clamp for the Kalman prediction step (s)
