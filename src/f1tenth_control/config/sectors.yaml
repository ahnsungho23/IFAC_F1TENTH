# sectors.yaml — 섹터별 max_lateral_accel 스케일 (control_map_node의 sector_scale_*)
#
# 이 파일이 **주행에 적용되는 실물**이다. 고치는 값은 `scale` 하나뿐이고, 나머지(s 구간·
# track_length)는 bag 분석 결과라 손대지 말 것 — 라인이 바뀌면 도구로 다시 뽑는다.
#
#   적용되는 횡가속 권한 = max_lateral_accel(런치 인자, 실차 기본 7.0) × scale
#   예) 전역 7.0에서  scale 1.10 → 7.70 / 1.20 → 8.40 / 1.30 → 9.10
#
# 쓰는 법:
#   1) ros2 launch f1tenth_control control_real.launch.py
#      (sector_scale_enable 기본: true → sector_learner가 자동 기동해 이 파일을 발행)
#   2) 이 파일의 🟢 섹터 scale을 변경 후 저장하기만 하면 즉시 자동 재발행! (별도 터미널 불필요)
#   3) 컨트롤러 로그 끝에서 `| 섹터 MLA 7.70 (×1.10)` 확인
#   4) 새 bag 녹화 → analyze_sector_clearance.py로 그 섹터가 여전히 🟢인지 재확인
#
# 🔵 2026-08-12: 발행기가 sector_learner.py 하나로 통합됐다(sector_pub.py 은퇴).
#    기본 모드 `static`은 이 파일을 그대로 발행할 뿐 값을 **안 바꾼다** — 구 sector_pub과
#    동일한 거동에 랩별 게이트 진단 로그만 얹힌다. 자율 학습을 원하면
#    `sector_learn_mode:=explore`(연습, 상향+하향) / `:=guard`(결선, 하향만).
#
# ⚠️ scale < 1.0은 금지(발행기·컨트롤러 양쪽에서 거부). 느리게 하려면 전역 max_lateral_accel을
#    낮출 것 — 1.0 미만을 허용하면 "테이블을 잃으면 위험 코너가 빨라지는" 구조가 된다.
# ⚠️ 🔴 보류 섹터는 벽 여유/횡오차 기준을 통과 못 한 곳이다. 올리지 말 것.
# 🟢 2026-08-13: 라인(글로벌 경로)을 재생성해도 **이 파일을 손볼 필요가 없다.** track_length가
#    안 맞으면 sector_learner가 그 자리에서 κ로 경계를 새로 만들고 scale 1.0에서 시작한다
#    (= 전역 MLA와 동일). 이 파일의 scale은 그때 버려진다 — 다른 라인 기준이라 재사용 불가.
#    구 거동(발행 중단)이 필요하면 `--no-auto-sectors`.
#
# bag_analyzer 웹앱 자동 생성 — 검토 후 scale 조정
# scale은 max_lateral_accel에 곱해진다. 1.0 미만은 컨트롤러가 clamp로 막는다
# (전역 MLA를 보수값으로 두고 여기서만 여는 설계 — 미수신 시 항상 느려지는 쪽)
# 여기 없는 구간은 자동으로 scale 1.0. 직선은 그립 캡이 비활성이라 넣어도 이득 0.
track_length: 41.532   # 컨트롤러가 이 값으로 라인 동일성을 검증한다 (08-18 21:43 라인)
blend_len: 0.5
# 경계는 sector_learner 자동생성(learned_sectors_0818_214310.yaml, static 67랩)에서 가져옴.
# scale은 전부 1.0 = 전역 MLA와 동일(거동 불변). 올리기 전에 21:43 bag을
# analyze_sector_clearance.py로 돌려 🟢 판정을 받을 것.
sectors:
  - { s_start: 13.26, s_end: 17.76, scale: 1.0 }   # κp90 0.506, 미검증
  - { s_start: 17.76, s_end: 24.77, scale: 1.0 }   # κp90 0.443, 미검증
  - { s_start: 25.27, s_end: 29.02, scale: 1.0 }   # κp90 0.359 = 코너1(우) — K_us 분리 후 좌벽 여유 0.67 m 확보(21:43)
  - { s_start: 34.03, s_end: 39.28, scale: 1.0 }   # κp90 0.470 = 코너2(좌) — 좌 K_us 0.011 후 우벽 여유 med 0.78/p10 0.74로 회복(22:39). 21:43의 p10 0.12는 해소
  - { s_start: 39.28, s_end: 41.53, scale: 1.0 }   # κp90 0.378 — 21:43 estop 8회 몰렸던 구간이나 좌 K_us 0.011에서 바깥 이탈 -1.10→-0.19 m로 해소(22:39). 올리려면 재측정부터 (랩 넘어감 1/2)
  - { s_start: 0.00, s_end: 2.75, scale: 1.0 }   # κp90 0.378 — 위와 동일 구간 (랩 넘어감 2/2)
