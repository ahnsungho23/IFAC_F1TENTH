# 2026_IFAC shared visualization profile.
#
# true: competition monitoring mode. Nodes publish RViz visualization messages.
# false: change individual entries below to false when reducing Jetson/network load.
#
# This file is loaded after each package's normal YAML, so it overrides only the
# visualization/output switches listed here. Driving and planning parameters remain
# owned by their package YAML files.

particle_filter:
  ros__parameters:
    viz: true
    # Controls particle_filter's 5 Hz full OccupancyGrid mirror. The map_server
    # launched by MCL can also provide a latched /map.
    publish_map: true

global_trajectory_publisher_node:
  ros__parameters:
    publish_markers: true
    publish_lattice: true

obstacle_detector:
  ros__parameters:
    publish_markers: true

local_planner_node:
  ros__parameters:
    publish_path_visualization: true

state_machine_node:
  ros__parameters:
    publish_path_visualization: true

control_map_node:
  ros__parameters:
    publish_l1_markers: true

static_obstacle_map:
  ros__parameters:
    publish_visualization: true

map_controller:
  ros__parameters:
    publish_debug_markers: true

lap_timer:
  ros__parameters:
    rviz_text: true
    publish_hud: true
