# ================================================================================================
# MONTE CARLO LOCALIZATION (MCL) CONFIGURATION — real / bag 모드용
# ================================================================================================
# mod:=real/bag은 이 파일, mod:=sim은 mcl_config_sim.yaml을 mcl_launch.py가 선택해 로드.
# launch는 파라미터 값을 오버라이드하지 않는다 — 튜닝값은 이 YAML들이 단일 소스.
# ================================================================================================

particle_filter:
  ros__parameters:
    # === CORE ALGORITHM PARAMETERS ===
    max_particles: 500                 # Optimized particle count for real-time performance
    max_viz_particles: 200             # Increased visualization particles for diagnostics (T7)
    max_range: 10.0                    # Set laser max range 
    max_pose_range: 10000.0           # Maximum valid pose coordinate range (m)
    
    # === ESS RESAMPLING & CLUSTER POSE ESTIMATION (T5, T6) ===
    ess_threshold: 0.5                 # Resample only when ESS/N < threshold (T5)
    cluster_radius: 0.5                # Radius around max-weight particle for pose averaging (m) (T6)
    cluster_yaw_thres: 0.5             # Yaw tolerance around max-weight particle for pose averaging (rad) (T6)
    
    # === MODE & TF CONTROL ===
    publish_map_odom_tf: true          # Publish map->odom transform (real mode only)
    publish_odom_base_tf: false        # Let F1Tenth stack handle odom->base_link
    auto_init_from_waypoints: true     # Auto-initialize particles from /global_waypoints start pose
    
    # === MOTION MODEL NOISE ===
    # ※ 차체 프레임 기준 (D6 수정으로 body-frame 회전 적용)
    # ※ 0.15/0.25 = 실차 검증값. launch else 분기 시절 실차에 실제 적용되던 값이며,
    #    0.08/0.08로 낮췄을 때 실차에서 파티클 가중치 붕괴→재분산 반복(구름이 퍼짐)으로
    #    MCL 부작동이 관측되어 복원 (2026-08-03). 진동/스캔 노이즈가 큰 실차 환경에서는
    #    모션 노이즈가 너무 작으면 파티클이 가설을 커버하지 못한다.
    # 🔴 2026-08-14: 아래 세 값은 이제 **이동량에 비례해** 주입된다(particle_filter.cpp의
    # motion_scale). 이전에는 사이클마다 고정량이 들어가 차가 완전히 서 있어도 40 Hz로
    # 확산이 누적됐고(정지 1초당 위치 0.63 m·각도 72°), 이 트랙은 좌우 대칭 복도라 뒤집힌
    # 가설도 스캔이 맞아 추정 포즈가 통째로 점프했다(run_0814_220956: 정지 중 8 m·168° 5건).
    # 값 자체는 "완전 주행 중" 기준이므로 그대로 두고, 정지 중에는 자동으로 5%까지 줄어든다.
    motion_dispersion_x: 0.10          # 종방향(진행방향) 노이즈 σ (m)
    motion_dispersion_y: 0.02          # 횡방향 노이즈 σ (m)
    motion_dispersion_theta: 0.20      # 회전 노이즈 σ (rad)
    
    # === POSE SMOOTHING ===
    # ── Pose EMA smoothing (0.0=max smooth, 1.0=no smooth) ─────────────────────
    # 유효 alpha = min(alpha_max, smoothing_alpha + min(1, |v|/velocity_full)·alpha_gain)
    # 출력 지연 시정수 τ ≈ (1/timer_frequency)·(1-α)/α.
    # 구 실차값 0.05는 저속(α≈0.05)에서 τ≈0.63 s — "MCL이 늦게 따라온다"의 주범이라
    # 0.3(τ≈77 ms)으로 상향 (2026-07-29). 지터가 늘면 0.2까지 낮춰볼 것.
    # 시뮬은 mcl_launch.py가 0.5로 오버라이드(모션 모델 튜닝과 한 세트).
    smoothing_alpha: 0.15
    smoothing_velocity_full_mps: 3.0   # 이 속도 이상에서 속도 적응 보정이 최대
    smoothing_alpha_gain: 0.28          # 최대 속도에서 base에 더해지는 폭 (0.3→0.7)
    smoothing_alpha_max: 0.8           # 유효 alpha 상한

    # ── Pose fusion EKF (odom 예측 + MCL 보정, 2026-07-29) ─────────────────────
    # 장복도(평행벽)에서 라이다가 진행방향을 관측하지 못해 파티클 기대값이 종방향으로
    # 표류하는 문제의 해법: 휠 odom(주행거리 대비 ~0.3% 오차)으로 매 주기 예측하고 MCL
    # 기대 포즈로 보정하되, 측정 노이즈 R = 파티클 가중 공분산 — 복도에선 종방향 분산이
    # 커서 자동으로 odom 유지, 코너에선 분산이 작아 MCL로 재고정된다.
    # true면 EMA 스무딩 대신 EKF 출력이 /pf/pose/odom이 된다 (false = 구 EMA 거동).
    # ⚠️ false 운용 사고 기록(2026-08-03, run_0803_180758): EKF off + D6 body-frame 노이즈
    # 상태에서 4.6 m/s 직진 중 MCL이 종방향으로 ~2.5~4 m 후방 스냅 → 벽 충돌.
    # bag 재생 A/B로 EKF on 시 동 구간 오차 0.4 m로 스냅 소거 확인 → true 복원.
    use_pose_ekf: true
    # 병진 오차율: 실차 휠 odom 고유 오차는 ~0.3%지만, 30Hz 델타 적용·헤딩 결합 오차를
    # 포함한 유효값으로 1%를 쓴다(과소하면 게인이 죽어 사실상 데드레커닝이 됨).
    ekf_trans_error_rate: 0.03         # 주행거리 대비 병진 오차율
    ekf_trans_floor_mps: 0.01          # 병진 프로세스 노이즈 시간 하한 [m/s]
    ekf_lat_error_ratio: 0.3           # 종방향 시그마 대비 횡방향 비율
    ekf_rot_error_rate: 0.10           # 회전량 대비 요 오차율
    ekf_rot_floor_radps: 0.02          # 요 프로세스 노이즈 시간 하한 [rad/s]
    ekf_meas_var_inflation: 1.0        # 파티클 공분산 → R 전역 배율
    # 평행벽 복도에서 MCL이 진행방향 위치를 관측 못 해 "틀린 곳에 좁게" 수렴하므로
    # (공분산이 모호성 과소평가), 차체 종방향 R만 항상 크게 부풀린다. 복도 표류는 무시되고
    # 코너를 돌면 이전 종방향 오차가 횡방향으로 회전돼 고게인으로 보정된다.
    ekf_meas_long_inflation: 44.0      # 종방향(진행방향) R 배율 (= 표준편차 5배)
    ekf_meas_pos_std_floor: 0.02       # 측정 위치 표준편차 하한 [m] (과신 방지)
    ekf_meas_yaw_std_floor: 0.02       # 측정 요 표준편차 하한 [rad]
    ekf_gate_chi2: 25.0                # 마할라노비스 게이트(3자유도), 0=비활성
    ekf_gate_force_accept: 120          # 연속 기각 이 횟수 도달 시 MCL로 재고정
    ekf_gate_force_accept_dist: 6.0    # 기각 중 누적 주행거리가 이 값[m]이어도 재고정 (고속 묵보정 방지, 0=해제)

    # === ROBOT GEOMETRY ===
    # lidar 오프셋은 TF(base_link→laser)에서 읽는다 (실패 시 코드 기본값 0.27 m)
    wheelbase: 0.33                   # Distance between axles (m)
    
    # === SENSOR MODEL (4-component beam model) ===
    z_hit: 0.80                        # Weight for correct measurements (increased for better tracking)
    z_short: 0.01                      # Weight for unexpected obstacles
    z_max: 0.05                        # Weight for max range readings (reduced)
    z_rand: 0.14                       # Weight for random noise (reduced)
    sigma_hit: 7.0                     # Measurement noise std dev (tightened)

    # === 스캔 강건화 (다이낯믹 환경 대응, 2026-08-03) ===
    # 환경이 맵과 부분적으로 달라도(가구 이동, 사람 등) 정답 가설이 급사하지 않게 함.
    ray_likelihood_floor_ratio: 0.05   # per-ray likelihood 하한 (센서 모델 열 최댓값 대비).
                                       # 0=비활성. 틀린 레이 1개의 최대 벌점이 66배→20배로 제한됨
    use_scan_quality_r: true           # 스캔 품질 연동 측정 노이즈 R 부풀림 (EKF 모드)
    scan_quality_outlier_gain: 1.5     # K_OUTLIER — outlier 비율 기반 R 부풀림 강도
    scan_quality_outlier_start: 0.15   # q0 — outlier 비율이 이 이하면 페널티 없음
    scan_quality_ess_gain: 2.0         # K_ESS — ESS 하락 기반 R 부풀림 강도
    scan_quality_ess_start: 0.4        # ess0 — ESS/N이 이 이하면 페널티 시작
    
    # === RAY CASTING ===
    angle_step: 18                     # Laser downsampling factor
    squash_factor: 2.5                 # Weight normalization (지수 = 1/이값, 작을수록 대비 눌림)
    # 상황별 squash 조정 (2026-08-04). 과거 코드는 min/max 상수가 거꾸로라 두 분기가
    # no-op이었음 → 토글로 복원. false=조정 없음(구 거동, 문제 시 롤백용).
    use_adaptive_squash: false          # true면 아래 두 상황별 조정 활성
    squash_factor_high_speed_curve: 3.5  # 고속 커브(v>4 & |w|>0.3): 지수 1/3.5≈0.29로 더 눌러 소수 파티클 지배 완화
    squash_factor_fast_convergence: 1.2  # 초기 수렴 N회: 지수 1/1.2≈0.83으로 더 뾰족하게 정답 가설 빨리 선택
    use_parallel_raycasting: true      # Enable parallel processing
    num_threads: 0                     # Auto-detect threads
    
    # === ROS INTERFACE ===
    scan_topic: "/scan"                # LaserScan input topic
    odom_topic: "/odom"                # Odometry input topic
    publish_odom: true                 # Publish pose as odometry message
    # 발행 전방 외삽 [s]: /pf/pose/odom 위치를 진행방향으로 v×이 값만큼 밀어 발행 (0=off).
    # 2026-08-14 실측: 출력 병진이 실제보다 ~90 ms 지연 (스캔 나이 + 연산 + 타이머 양자화 +
    # VESC odom 직렬 지연 합). 코너에서 v×κ로 벽 방향 오차에 투영 — 90 ms 보정 시 코너 p95
    # 0.101→0.000, 최악 코너 0.144→0.050, 직선 부작용 없음 (무장애물 백 5개 591프레임).
    # 요는 지연이 없어 위치만 민다. 코드가 [0, 0.15]로 클램프. 재는 법: scratchpad
    # mcl_decompose.py류 스캔-벽 잔차의 v×τ 스윕 최소점.
    publish_extrapolation_sec: 0.09
    viz: true                          # Enable particle visualization
    timer_frequency: 40.0              # MCL update frequency (Hz) - increased for simulation
    
    # === TF FRAME NAMES ===
    map_frame: "map"                   # Global reference frame
    odom_frame: "odom"                 # Odometry frame
    base_frame: "base_link"            # Robot base frame
    laser_frame: "laser"               # Laser scanner frame
    
    # === PERFORMANCE & DEBUGGING ===
    # (fine_timing 삭제 — 코드에서 읽지 않는 dead 파라미터였음)

# ================================================================================================
# MAP SERVER CONFIGURATION
# ================================================================================================
map_server:
  ros__parameters:
    # Default map file (override with launch argument: map_name:='your_map')
    map: 'oct_25_1'                      # Map name without .yaml extension
