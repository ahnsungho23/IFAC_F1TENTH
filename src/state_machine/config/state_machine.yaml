state_machine_node:
  ros__parameters:
    state_topic: "/state"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_waypoints/path"

    frenet_odom_topic: "/car_state/frenet/odom"
    global_waypoints_topic: "/global_waypoints"
    avoid_waypoints_topic: "/avoid_waypoints"
    opponent_topic: "/opp_obs"

    frame_id: "map"
    default_state: "global"

    # /state의 FSM 평가/heartbeat 주기입니다. local waypoint는 Frenet odom 이벤트로 발행합니다.
    # GLOBAL/CRUISE의 /local_waypoints는 검증된 /global_waypoints 배열 전체를 창 없이 통과합니다
    # (2026-08-26, docs/global_passthrough_proposal.md). 옛 waypoint_num 창 파라미터는 삭제됨.
    publish_rate_hz: 10.0

    # AVOID는 모든 상태에서 최우선입니다. CRUISE는 /opp_obs의 is_interfering=true로 진입합니다.
    allow_avoid_transition: true
    # 🟢 CRUISE 진입 ON. **활성화 3요소를 항상 같이 켜고 같이 끈다**:
    #    이 값 / obstacle_detector 의 dynamic_min_translation_m 0.18 /
    #    f1tenth_control 런치의 cruise_enable — f1tenth_control 의
    #    test/test_cruise_contract.py 가 all-on/all-off 를 강제한다.
    #    (한쪽만 켜도 no-op 이 아니다: control_map_node 가 /state 를 구독해 STATE_CRUISE 에서
    #     avoiding_now() 가 참이 되고 L1 감쇠·섹터 게이팅이 바뀐다. cruise_enable 만 켜진
    #     상태에서 cruise 노드가 죽으면 1.5 m/s fail-closed 캡이 전 구간에 걸린다.)
    #    ⚠️ 페일세이프(blind_trailing_speed / cruise_stale_speed 기본 1.5 m/s)는 실측 구동계
    #    데드존(~2.5 m/s) 아래다. stale 이 지속되면 재출발이 막힐 수 있다(run_0821_092111).
    #    transition_global 과 같은 값을 그대로 쓰고 있으며, 변경은 별도 제안으로 다룬다.
    allow_cruise_transition: true
    local_path_confirmation_window_size: 5
    local_path_confirmation_min_hits: 3

    # GLOBAL은 검증 후 정적 경로로 계속 사용하며, 발행자 침묵은 경고만 냅니다.
    global_publisher_warn_timeout_sec: 5.0
    # 모든 local waypoint 출력에 공통 적용하는 Frenet freshness 게이트입니다.
    frenet_stale_timeout_sec: 0.5
    # 마지막 /opp_obs가 이 시간보다 오래되면 간섭 없음으로 보고 CRUISE에서 GLOBAL로 복귀합니다.
    opponent_stale_timeout_sec: 0.3
    invalid_local_path_policy: "global_fallback"

    # 간섭 판단(CRUISE 진입/유지)은 이 노드가 /opp_obs 의 위치·속도·공분산으로 직접 수행한다.
    # 🔴 2026-08-22 복구: 8010b2f9 포팅이 이 술어를 지우고 detector 의 is_interfering
    #    (진입 1.0 m)에 위임했는데, cruise 의 목표 간격은 5.0 m 라 아래 불변식이 깨져
    #    상대차가 있어도 CRUISE 로 진입하지 못했다.
    # 🔴 2026-08-25: p* = p_lat * p_long 곱 결합을 뺐다가, 같은 날 사용자 지시로 OR 결합으로
    #    복원했다. 지금은 두 독립 조건 중 하나만 맞아도 CRUISE(간섭)로 판정한다:
    #      (a) 종방향 gap(ego 앞범퍼~상대 중심, wrapForward) <= interference_distance_m, 또는
    #      (b) interferenceProbability()의 p_lat(횡방향 확률) >= interference_p_on
    #    둘 다 여전히 전방 반바퀴 게이트(longitudinalGapMeters/interferenceProbability 내부)를
    #    통과해야 한다. 곱 결합과 달리 OR이라 "가까운데 옆줄"이든 "멀어도 같은 줄"이든 둘 중
    #    하나만 걸리면 즉시 잡힌다 — interference_lateral_margin_m 가 크면 (b) 경로가 더 쉽게
    #    열리므로 그 파라미터 자체의 오진입 상한(아래 참고)은 distance_m 값과 무관하게 그대로
    #    적용된다.
    # 실제 불변식: "cruise의 목표 간격 <= interference_distance_m". 목표 간격을 이 값 위로 두면
    # cruise 가 유지하려는 바로 그 간격에서 상태머신이 (a) 경로 기준 간섭 없음으로 판정해 CRUISE
    # 를 빠져나가고, 상한이 풀려 가속했다가 재진입하는 급정지/재가속 리밋사이클이 생긴다.
    interference_distance_m: 4.0
    interference_horizon_sec: 0.5
    # 🟢 2026-08-24: rosbag2_2026_08_23-06_49_50(250~308 s)을 /map 점유격자로 지도 구조를
    #    제거한 /scan 클러스터로 독립 라벨링해 스윕한 결과다. 라벨(전방 5 m 이내 + 횡 겹침)
    #    15.4 s 기준 재현율 76.9% -> 86.0%, 오진입 4.6 -> 7.7 s.
    #    ⚠️ 상한은 91%다 — 라벨 프레임의 9%는 /opp_obs 가 물체를 아예 발행하지 않은
    #    구간이라(265.3~267.9 s 등 /scan 에는 계속 보인다) 이 파라미터로는 못 잡는다.
    #    되돌리기: p_on 0.7 / p_off 0.4 / lateral_margin 0.10.
    interference_p_on: 0.5
    interference_p_off: 0.25
    interference_ego_half_width_m: 0.16
    # 🔴 0.10 -> 0.30 -> 0.36 (2026-08-25, 라이다 기준 차폭 마진 40cm 요청). 이 값은 근사
    #    처방이다 — P_lat 의 밴드가 ego 의 실제 d 가 아니라 글로벌 라인(d=0) 중심이라
    #    (interference_predicate.cpp 의 intervalProbability(-b, +b)) ego 와 상대차가 둘 다
    #    라인에서 벗어난 채 같은 차선에 있으면 확률이 붕괴한다.
    #    실측: t=300.80~301.20 에 간격 1.37 -> 0.20 m, |Δd| 0.31~0.40 m 인데 p* 0.17 -> 0.00.
    #    밴드를 넓혀 그 구간을 덮는 것이라 근본 수정(밴드를 ego.d 중심으로 이동)이 되면
    #    0.10 으로 되돌릴 것. b_eff = ego_half_width + 이 값 + 상대차 반폭.
    #    ⚠️ 0.40 이상은 금지 — |Δd| > 0.7 m(진짜 다른 라인) 오진입이 7% -> 19% 로 뛴다.
    #    요청한 40cm는 이 상한과 정확히 겹쳐 0.36으로 절충했다(margin 확보하면서 상한 회피).
    interference_lateral_margin_m: 0.36
    # 🟢 2026-08-25부터 다시 살아있는 값 — longitudinalGapMeters()의 ego 앞범퍼 오프셋으로
    #    OR 결합의 (a) 종방향 경로에 쓰인다.
    interference_ego_front_offset_m: 0.25

    # AVOID -> GLOBAL 복귀 계약 (2026-08-16 개정).
    # 장애물 제거 판정의 단일 소유자는 플래너입니다. 플래너가 남은 blocking cluster가
    # 없음을 확인한 뒤 발행하는 ot_line 표식이 있어야만 아래 거리·횡오차·지속시간 검사를
    # 평가합니다. FSM이 /static_obs와 ego 횡위치로 같은 것을 중복 판정하던
    # has_front_static_obstacle / stopped_path_clear 계열은 제거했습니다(ego가 회피
    # 오프셋에 있으면 라인 위 장애물과 겹치지 않아 오판, 플래너와 다른 토픽 사용).
    handoff_ot_line: "raceline_global_handoff"
    enter_global_sec: 0.5
    enter_global_threshold: 0.2
    # 경로 끝에서 거꾸로 잰 tail 창의 **호 길이**[m]. local_planning의
    # state_handoff_tail_distance_m와 반드시 같은 값이어야 합니다 — 플래너는 핸드오프
    # 루프를 회전해 ego를 정확히 이 tail 구간의 첫 점에 놓습니다. 값이 어긋나면 tail이
    # ego에서 (플래너값-FSM값)만큼 떨어진 곳에서 시작해 게이트가 성립하지 않습니다
    # (2026-08-16 11:26/11:28 백: 플래너 6.0 / FSM 1.0 불일치로 8랩 전이 0회 실측).
    #
    # ⚠️ 비율(enter_global_tail_ratio)로 되돌리지 마십시오. 비율은 "무엇의 몇 %"가
    # 경로 종류마다 달라집니다 — 핸드오프 루프는 트랙 한 바퀴(43 m)라 10%가 4.3 m지만
    # 회피 경로는 12 m라 1.2 m가 되어 창이 3.5배 요동합니다. 2026-08-16 팀 병합이 이
    # 파일을 옛 버전으로 되돌리면서 비율 키가 되살아난 적이 있습니다.
    enter_global_tail_distance_m: 6.0
    enter_global_s_gap_tol_m: 0.5

    # 🔴 2026-08-26: 유일한 비표식 AVOID 탈출이 **정지 프로파일 즉시 탈출**로 교체됐습니다.
    # `/avoid_waypoints`의 모든 점이 vx_mps=0 · ax_mps2=0이면(= local_planning의 제자리 홀드,
    # 또는 정지점에 도달한 safe-stop) 그 즉시 GLOBAL로 나옵니다. 파라미터가 없습니다 —
    # 사용자 지시로 시간 홀드(타임아웃·디바운스)를 두지 않으며, 옛
    # `avoid_path_liveness_timeout_sec: 2.0`은 삭제됐습니다.
    # ⚠️ 그 결과 "플래너가 완전히 침묵할 때"의 탈출은 없습니다(마지막 non-empty 회피 경로를
    # 들고 AVOID에 머뭅니다). 정지 프로파일은 AVOID 진입 M-of-N에도 세지 않습니다.
