state_machine_node:
  ros__parameters:
    state_topic: "/state"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_waypoints/path"

    frenet_odom_topic: "/car_state/frenet/odom"
    global_waypoints_topic: "/global_waypoints"
    avoid_waypoints_topic: "/avoid_waypoints"
    opponent_topic: "/opp_obs"
    static_obstacles_topic: "/static_obs"

    frame_id: "map"
    default_state: "global"

    # /state의 FSM 평가/heartbeat 주기입니다. local waypoint는 Frenet odom 이벤트로 발행합니다.
    publish_rate_hz: 10.0
    waypoint_num: 50

    # AVOID는 모든 상태에서 최우선입니다. CRUISE는 /opp_obs의 is_interfering=true로 진입합니다.
    allow_avoid_transition: true
    allow_cruise_transition: true
    local_path_confirmation_window_size: 5
    local_path_confirmation_min_hits: 3

    # GLOBAL은 검증 후 정적 경로로 계속 사용하며, 발행자 침묵은 경고만 냅니다.
    global_publisher_warn_timeout_sec: 5.0
    # 모든 local waypoint 출력에 공통 적용하는 Frenet freshness 게이트입니다.
    frenet_stale_timeout_sec: 0.5
    # 마지막 /opp_obs가 이 시간보다 오래되면 간섭 없음으로 보고 CRUISE에서 GLOBAL로 복귀합니다.
    opponent_stale_timeout_sec: 0.3
    invalid_local_path_policy: "global_fallback"

    # Local path -> GLOBAL 합류 조건입니다.
    enter_global_sec: 0.5
    enter_global_threshold: 0.2
    enter_global_tail_ratio: 0.1
    enter_global_s_gap_tol_m: 0.5

    # 회피 경로가 비거나 갱신이 끊긴 뒤 마지막 경로 tail에 도달하면 교착 탈출을 허용합니다.
    avoid_path_stale_timeout_sec: 0.5
    avoid_path_exhaustion_sec: 0.5
    avoid_path_exhaustion_s_gap_tol_m: 0.75

    # 정지 회피 경로가 정상 합류 조건(vx_mps > 0)을 의도적으로 거부할 때의 보험 복귀.
    # /static_obs가 stale이면 장애물 없음으로 간주하지 않으며, 전방 corridor가 비어 있는
    # 상태가 stopped_path_clear_sec 동안 유지될 때만 GLOBAL(0)으로 복귀합니다.
    static_obstacles_stale_timeout_sec: 0.3
    stopped_path_clear_sec: 1.0
    stopped_path_speed_threshold_mps: 0.01
    stopped_path_obstacle_lookahead_m: 3.0
    stopped_path_ego_half_width_m: 0.16
