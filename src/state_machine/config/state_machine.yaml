state_machine_node:
  ros__parameters:
    state_topic: "/state"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_waypoints/path"

    frenet_odom_topic: "/car_state/frenet/odom"
    global_waypoints_topic: "/global_waypoints"
    avoid_waypoints_topic: "/avoid_waypoints"
    overtake_waypoints_topic: "/overtake_waypoints"

    frame_id: "map"
    default_state: "global"

    # /state의 FSM 평가/heartbeat 주기입니다. local waypoint는 Frenet odom 이벤트로 발행합니다.
    publish_rate_hz: 10.0
    # CMA timing audit only. Normal runtime keeps the 10 Hz production rate above.
    timing_diagnostics_enable: false
    timing_diagnostics_topic: "/cma_timing/events"
    tuning_publish_rate_hz_override: -1.0
    # CMA 전용: 동일 stamp의 Frenet odom + avoid path가 모였을 때만 FSM을 1회 실행합니다.
    lockstep_mode: false
    waypoint_num: 50

    # false면 해당 GLOBAL -> local 상태 진입만 차단합니다. 복귀 판정은 항상 동작합니다.
    allow_avoid_transition: true
    allow_overtake_transition: false
    local_path_confirmation_window_size: 5
    local_path_confirmation_min_hits: 3

    # OVERTAKE 경로는 hold 중 새 경로/빈 메시지를 무시하고, hold 이후 수신 이벤트로만 갱신합니다.
    overtake_hold_duration_sec: 2.0
    # GLOBAL은 검증 후 정적 경로로 계속 사용하며, 발행자 침묵은 경고만 냅니다.
    global_publisher_warn_timeout_sec: 5.0
    # 모든 local waypoint 출력에 공통 적용하는 Frenet freshness 게이트입니다.
    frenet_stale_timeout_sec: 0.5
    invalid_local_path_policy: "global_fallback"

    # Local path -> GLOBAL 합류 조건입니다.
    enter_global_sec: 0.5
    enter_global_threshold: 0.2
    enter_global_tail_ratio: 0.1
    enter_global_s_gap_tol_m: 0.5
