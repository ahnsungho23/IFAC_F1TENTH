opponent_drive_controller:
  ros__parameters:
    waypoints_topic: "/centerline_waypoints"
    opponent_odom_topic: "/opp_racecar/odom"
    opponent_drive_topic: "/opp_drive"

    speed_scale: 0.8
    lookahead_distance_m: 2.0
    wheelbase_m: 0.33
    steering_limit_rad: 0.4
    control_rate_hz: 40.0
    odom_timeout_sec: 0.5
    enabled: true
