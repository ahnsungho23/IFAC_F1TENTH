global_planning_node:
  ros__parameters:
    map_dir: "src/global_planning/data"
    run_once: false
    trigger_on_start: false

global_trajectory_publisher_node:
  ros__parameters:
    # The initial global_waypoints.json is read from <output_base_dir>/<map_name>/.
    # Relative paths resolve from the
    # `ros2 launch` working directory, so launch from the workspace root (~/2026_IFAC).
    # NOTE: global_planning.launch.py overrides the initial map_name with its launch
    # argument (F1_MAP env or the launch default).
    output_base_dir: "offline_trajectory_generator/output"
    map_name: "map"
    # /global_planning/reload_waypoints atomically switches the in-memory source to
    # <output_base_dir>/<reload_map_name>/global_waypoints.json. YAML is not rewritten.
    reload_map_name: "obstacle_map"
    # map_path: ""   # optional initial-directory override (reload target remains obstacle_map)
    #
    # Lap-triggered one-way switch to a PRE-GENERATED bundle (Forza offline raceline).
    # Reference path over a run: map -> (lap 3, map_creator swap) obstacle_map
    #                                -> (lap 11, here) forza_map
    # The bundle must exist before the run; generate it with
    #   cd offline_trajectory_generator
    #   python3 forza_trajectory_gui.py --output-dir output/forza_map ...
    # (the Forza GUI's own default is output/<map>/forza, so pass --output-dir).
    # A missing or invalid bundle is rejected and the live line is kept; the next lap
    # message retries. Empty lap_switch_map_name disables the switch.
    # map_creator cannot undo this: its post-swap stage is terminal (map_creator AGENTS.md).
    lap_switch_map_name: "forza_map"
    lap_switch_count: 11
    lap_count_topic: "/lap_count"
    publish_markers: true
    publish_shortest_path: true
    publish_centerline: true
    publish_lattice: false
    publish_period_sec: 2.0
    # RViz markers come baked in global_waypoints.json (offline generator).
    # The map_creator regeneration path writes empty arrays on purpose, so after a
    # reload this node publishes a DELETEALL instead of stale markers.

frenet_odom_node:
  ros__parameters:
    odom_topic: "/pf/pose/odom"
    waypoint_topic: "/global_waypoints"
    frenet_odom_topic: "/car_state/frenet/odom"
    frenet_frame_id: "frenet"
    closed_loop: true
    projection_failure_policy: "drop_message"
    path_change_tolerance: 0.0001
    duplicate_point_tolerance: 0.001
    tangent_epsilon: 0.05
    publish_heading_error: true
    publish_frenet_velocity: true
    compatibility_mode: false
    velocity_frame: "body"
    covariance_mode: "zero"
    use_path_preprocessing: true

    # Monotonic s-window tracking
    continuity_enabled: true
    forward_window: 1.0
    backward_tolerance: 0.5
    initial_seed_window: 0.0
    tracked_max_projection_distance: 1.5
    reacquire_after_misses: 5

    max_projection_distance: 2.5
    projection_domain_limit: 2.7
    projection_domain_epsilon: 0.1
    projection_domain_eps2: 0.0
    projection_domain_method: 1
    min_path_length: 0.5
    large_gap_factor: 5.0

lap_counter_node:
  ros__parameters:
    frenet_odom_topic: "/car_state/frenet/odom"
    lap_count_topic: "/lap_count"
    # Count one lap only when the previous sample is in the finish region and
    # the current sample has wrapped into the start region.
    finish_s_min: 10.0
    start_s_max: 0.5
    min_lap_time_sec: 3.0
    initial_lap_count: 0
