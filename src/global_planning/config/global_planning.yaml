global_planning_node:
  ros__parameters:
    map_dir: "src/global_planning/data"
    optimizer_command: "python3 src/global_planning/vendor/gb_optimizer/src/global_planner_node_ros2.py"
    pythonpath_extra: "src/global_planning/vendor/gb_optimizer/src:src/global_planning/vendor/gb_optimizer"
    run_once: false
    trigger_on_start: false

global_trajectory_publisher_node:
  ros__parameters:
    # global_waypoints.json is read from <output_base_dir>/<map_name>/.
    # Switch maps by changing map_name only. Relative paths resolve from the
    # `ros2 launch` working directory, so launch from the workspace root (~/2026_IFAC).
    output_base_dir: "offline_trajectory_generator/output"
    map_name: "map"
    # map_path: ""   # optional explicit directory override (bypasses output_base_dir/map_name)
    publish_markers: true
    publish_shortest_path: true
    publish_centerline: true
    publish_lattice: false
    publish_period_sec: 2.0
    # Marker generation (node builds RViz markers from waypoints; JSON has none).
    marker_frame_id: "map"
    traj_marker_width: 0.10
    trackbound_marker_width: 0.05

frenet_odom_node:
  ros__parameters:
    odom_topic: "/pf/pose/odom"
    waypoint_topic: "/global_waypoints"
    frenet_odom_topic: "/car_state/frenet/odom"
    frenet_frame_id: "frenet"
    closed_loop: true
    projection_failure_policy: "drop_message"
    path_change_tolerance: 0.0001
    duplicate_point_tolerance: 0.001
    tangent_epsilon: 0.05
    publish_heading_error: true
    publish_frenet_velocity: true
    compatibility_mode: false
    velocity_frame: "body"
    covariance_mode: "zero"
    use_path_preprocessing: true
    # --- Monotonic s-window tracking (closed-loop wrap) ---
    # After the first fix only [s_prev - backward_tolerance, s_prev +
    # forward_window] (mod track length) is searched, so branches that are
    # near in space but far in arc length (hairpin opposite leg: 1.41 m away,
    # ~half a lap in s) can never capture the projection. A window miss fails
    # closed (projection_failure_policy applies); after reacquire_after_misses
    # consecutive misses ONE loud global re-search re-acquires progress
    # (teleport / RViz 2D Pose Estimate). 0 = strict fail-closed.
    continuity_enabled: true
    forward_window: 1.0             # [m] W ahead of s_prev
    backward_tolerance: 0.5         # [m] epsilon behind s_prev
    initial_seed_window: 0.0        # [m] first fix: 0 = full search; >0 = [0, this]
    # Euclidean gate for tracked fixes only. Must exceed the largest
    # legitimate |d| (avoidance excursions ~1.1 m) and stay below the
    # smallest branch gap (hairpin legs 1.41 m).
    tracked_max_projection_distance: 1.5
    reacquire_after_misses: 5      # ~0.17 s at 30 Hz odom
    max_projection_distance: 2.5
    projection_domain_limit: 2.7
    projection_domain_epsilon: 0.1
    projection_domain_eps2: 0.0
    projection_domain_method: 1
    min_path_length: 0.5
    large_gap_factor: 5.0
