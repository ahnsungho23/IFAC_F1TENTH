map_controller:
  ros__parameters:
    # 상대 경로는 패키지 share 기준으로 해석되고, `~`/`$HOME`으로 시작하면 홈으로 펼쳐진다.
    global_waypoints_csv: /home/miru/2026_IFAC/offline_trajectory_generator/output/map/global_waypoints.csv
    package_resource_root: ''
    frame_id: map
    base_frame_id: base_link
    # state_machine(/state, f110_msgs/StateMachine) 기준 상태 이름: global/avoid/overtake (빈 문자열이면 게이팅 해제)
    active_state: global

    global_waypoints_topic: /global_waypoints
    local_waypoints_topic: /local_waypoints
    simulator: false

    # Leave these empty to use the simulator/vehicle topic profile below.
    drive_topic: ''
    pose_topic: ''
    speed_topic: ''
    state_topic: /state
    imu_topic: ''
    steering_marker_topic: steering
    lookahead_marker_topic: lookahead_point
    waypoint_marker_topic: my_waypoints
    l1_topic: l1_distance

    simulator_drive_topic: /drive
    simulator_pose_topic: /ego_racecar/odom
    simulator_speed_topic: /ego_racecar/odom
    simulator_imu_topic: ''
    vehicle_drive_topic: /drive
    vehicle_pose_topic: /pf/pose/odom
    vehicle_speed_topic: /odom
    vehicle_imu_topic: /sensors/imu/raw

    publish_global_waypoints: true
    use_local_waypoints: true
    fallback_to_global_waypoints: true
    stop_on_state_mismatch: false
    publish_debug_markers: true

    control_rate_hz: 40.0
    global_publish_rate_hz: 1.0
    min_lookahead_distance: 1.5
    max_lookahead_distance: 5.0
    lookahead_gain: 0.5
    lookahead_speed_gain: 0.3
    speed_lookahead_time: 0.15
    speed_lookahead_for_steering: 0.0

    lateral_error_coeff: 1.0
    min_lateral_error: 0.01
    max_lateral_error: 0.5
    curvature_scale: 0.8
    curvature_window: 20

    wheelbase: 0.33
    max_steering_angle: 0.42
    max_steering_delta: 0.4
    acceleration_scaler_for_steering: 1.2
    deceleration_scaler_for_steering: 0.9
    start_scale_speed: 7.0
    end_scale_speed: 8.0
    downscale_factor: 0.1
    acceleration_filter_size: 10

    default_track_bound: 0.0
    local_waypoint_timeout_sec: 0.5
    waypoint_safety_timeout_sec: 1.0
    marker_stride: 3
