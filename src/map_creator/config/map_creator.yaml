map_creator_node:
  ros__parameters:
    # ---- topics / service ----
    obstacle_map_topic: "/adaptive_obstacle_map"
    global_waypoints_topic: "/global_waypoints"
    lap_count_topic: "/lap_count"
    reload_service: "/global_planning/reload_waypoints"

    # ---- trigger / ledger ----
    trigger_lap_count: 2          # freeze at the lap-2 finish (lap_count 1 -> 2)
    match_max_ds_m: 1.0           # 입력 메시지의 Frenet s 기준 wrap-aware 기하 매칭
    match_max_dd_m: 0.3           # 입력 메시지의 Frenet d 기준 기하 매칭
    removal_miss_laps: 2          # authoritative snapshot에서 사라진 뒤 rollback hysteresis

    # ---- side decision (full snapshot; MAP_CREATOR_PROPOSAL 4) ----
    # These are map_creator's OWN tuned values and intentionally differ from the
    # runtime local_planning.yaml. Provenance: calibration hand-off 2026-08-06
    # (사용자 제공 튜닝 값) — record the objective/dataset here when known.
    ego_lookback_m: 12.0          # max entry 6*1.9046=11.43 m must not truncate
    decision:
      transition_distance_scales: [0.180794, 0.963633, 1.904460]
      outside_line_transition_scale: 0.356840
      # Post-sync(70c5a9d) 이관: 구 obstacle_clearance_m 0.25는 장애물 모서리->경로
      # 중심 전체 인플레이션(반폭 포함)이었으므로 반폭(0.121)을 뺀 나머지를
      # safety_margin_m으로 옮김. tracking_error_reserve_m 0.0이면 strict == relaxed
      # clearance가 되어 구 "tight retry 비활성" 튜닝 의도가 유지됨.
      # (구 commitment_clearance_reserve_m는 런타임 커밋 재검증 전용이라 오프라인
      #  판정에는 해당 없음 -> 제거)
      safety_margin_m: 0.129
      tracking_error_reserve_m: 0.0
      wall_safety_margin_m: 0.087942   # 구 boundary_margin_m
      minimum_target_offset_m: 0.168582
      maximum_lateral_slope: 0.640085
      # Unlisted items pinned to the deployed local_planning.yaml values:
      maximum_target_offset_m: 1.50
      side_tie_epsilon_m: 0.02
      vehicle_half_width_m: 0.121
      obstacle_longitudinal_padding_m: 0.3
      detection_lookahead_m: 12.0
      fallback_track_half_width_m: 1.50

    # ---- painting (MAP_CREATOR_PROPOSAL 3.3) ----
    base_map_yaml: "src/monte_carlo_localization/maps/map.yaml"  # image: map.png
    nondrivable_threshold: 250    # pixel < 250 = non-drivable (generator free predicate)
    side_samples_min: 9
    ray_step_fraction: 0.25       # ray step = resolution / 4
    max_ray_length_m: 5.0         # beyond this: wall_not_found -> abort

    # ---- regeneration (driver = same gui_params.yaml values as the GUI) ----
    generator_driver: "offline_trajectory_generator/regenerate_obstacle_map.py"
    gui_params_yaml: "offline_trajectory_generator/gui_params.yaml"
    output_base_dir: "offline_trajectory_generator/output"
    output_map_name: "obstacle_map"
    baseline_map_name: "map"
    reseed_on_startup: true       # start every session from the baseline copy
    python_executable: "python3"
    generation_timeout_sec: 120.0
    initial_smooth_sigma: 4.1     # first generation pass
    retry_safety_width: 0.4       # keep the same safety width; retry changes smoothing only
    retry_smooth_sigma: 2.5       # retry generation pass

    # ---- regeneration / swap validation ----
    min_obstacle_clearance_after_m: 0.42   # local-planner silence clearance
    max_swap_deferral_laps: 3
