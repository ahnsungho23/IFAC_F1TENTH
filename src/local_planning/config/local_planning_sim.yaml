    # 장애물 미검출 프레임 기준)이므로 실측+여유로 0.06을 쓴다. 과도한 예약은 목표
    # 오프셋을 장애물에서 더 밀어내 **차를 벽쪽으로 붙인다** — 같은 상황 재현에서 0.12는
    # target_d -0.615/벽여유 0.260, 0.05는 -0.545/벽여유 0.328로 벽 여유가 26% 깎였다.
    # 🔴 2026-08-15: MCL을 upstream/adaptive_global 것으로 교체하면서 0.12.
    # 0.06은 particle_filter 발행 외삽이 90 ms 출력 지연을 제거한다는 전제로 낮춘
