    # 작아지는 구간의 상단 — 승격 후 LUT 사다리가 고르는 균형 속도와도 일치한다.
    raw_slowdown_speed_cap_mps: 2.8
    # Legacy A/B only. false keeps 2.8 m/s as the obstacle-front target and applies distance
