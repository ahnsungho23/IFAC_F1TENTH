    # 엔벨로프 확장·하드 검증·gap 속도 역산 전부에 동일하게 반영됩니다. retention 밴드
    # 스케일도 같이 적용(커밋 경로는 절반만 요구). 값 근거: 2026-08-13 00:45 시뮬 실측
    # (tools/mcl_gt_error_probe.py, 181.6s/3145샘플) — GT 대비 횡 |오차| 속도구간별 P95
    # 최악 6.3cm. 10cm 초과는 전부 1~3샘플(≤0.07s) MCL 보정 스파이크(최대 29.6cm)라
    # 정적 마진이 아닌 retention 밴드가 흡수합니다. 실차 전 재측정 필요(시뮬 기준값).
    # 0.12 = 2026-08-14 새 트랙 스캔-맵 정렬 오프셋 실측 p95 0.10~0.11 + 여유
