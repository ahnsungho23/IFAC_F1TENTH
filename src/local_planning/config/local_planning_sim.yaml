    # confirmed 승격(정지 표 10/15)이 끝나기 전에도 raw(/static_obs)는 4.5~11 m
    # 전방에서 이미 잡힌다 (run_080532·161657·192006 실측). 승격 지연은 시간 기준이라
    # 접근 속도를 미리 깎으면 지연이 잡아먹는 거리가 그만큼 줄고(5→2.8 m/s면 절반),
    # 승격이 무산된 패스(080532에서 14/107)도 저속 통과가 된다. 회피 기하·커밋·정지는
    # 만들지 않는 속도 전용 힌트다. 램프 기울기는 approach_feasibility_decel_mps2 재사용.
    raw_slowdown_enable: true
    raw_slowdown_topic: /static_obs
