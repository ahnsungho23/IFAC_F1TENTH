    # 브레이크 페어링(brake_gain ↔ prebrake_decel 2.6)보다 낮춰 잡은 실주행 달성치 —
    # 0814 슬립 중 실측 감속이 ~1.5였으므로 그립 여유를 남깁니다. 0 이하면 비활성(구 거동).
