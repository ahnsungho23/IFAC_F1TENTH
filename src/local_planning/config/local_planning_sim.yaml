    fallback_track_half_width_m: 1.50

    # 진입/복귀 quintic 프로파일의 [먼 점, 중간 점, 가까운 점]과
    # [가까운 점, 중간 점, 먼 점] 표본 거리입니다. 진입 nominal 길이는 ego에서 cluster까지
    # 실제 가용 거리에 pre_apex_far/detection_lookahead 비율로 적용하여 요청값이 바뀔 때
