    # 전멸했을 때의 2차(relaxed) 시도와 gap 기반 속도 역산에만 쓰이므로, 넓은 갭의 속도는
    # 변하지 않는다. 저속 LUT 행(v=0: 0.20)은 실측 보강 대상 — AGENTS.md 참고.
    avoidance_minimum_speed_mps: 1.0
