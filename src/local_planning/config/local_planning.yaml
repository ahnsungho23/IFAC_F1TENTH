local_planner_node:
  ros__parameters:
    # 가장 가까운 정적 장애물 군집만 계획합니다. 모든 거리는 글로벌 Race Line의 Frenet s/d 기준입니다.
    detection_lookahead_m: 12.0
    obstacle_cluster_gap_m: 0.8
    obstacle_longitudinal_padding_m: 0.3

    # 장애물 상자를 이 값만큼 횡방향으로 팽창한 뒤 차량 중심 경로를 만듭니다.
    # vehicle_half_width_m와 중복 합산하지 않도록 차량 반폭+추가 여유를 합친 값으로 설정합니다.
    obstacle_clearance_m: 0.35
    blocking_margin_m: 0.10
    vehicle_half_width_m: 0.121
    boundary_margin_m: 0.10
    fallback_track_half_width_m: 1.50

    # 참고 구현의 7개 pre/apex/post 제어점 개념을 정적 장애물 상자의 앞/뒤 경계로 확장했습니다.
    # 배열은 각각 [먼 점, 중간 점, 가까운 점], [가까운 점, 중간 점, 먼 점] 순서입니다.
    pre_apex_distances_m: [4.0, 3.0, 1.5]
    post_apex_distances_m: [1.5, 3.0, 4.0]
    # 짧은 spline부터 검사하고 곡률/경계 검사에 실패하면 같은 d-offset을 더 길게 펼칩니다.
    transition_distance_scales: [1.0, 1.25, 1.50]
    # 코너 바깥쪽 회피는 reference 구현처럼 전환 길이를 더 늘려 조향을 완만하게 합니다.
    outside_line_transition_scale: 1.35
    # d=0 합류점 뒤 글로벌 점을 덧붙여 controller와 state machine이 handoff를 완료할 시간을 줍니다.
    # 실제 tail은 max(post_merge_lookahead_m, 계획 시 ego_speed * post_merge_min_time_sec)입니다.
    post_merge_lookahead_m: 2.0
    post_merge_min_time_sec: 1.0
    minimum_target_offset_m: 0.20
    maximum_target_offset_m: 1.50
    # 최초 경로를 검증 AABB보다 더 바깥에 두어 작은 AABB 흔들림을 commitment가 흡수합니다.
    commitment_clearance_reserve_m: 0.05

    # 이동된 글로벌 점의 기하학적 주행 가능성 검사입니다.
    maximum_lateral_slope: 0.65
    maximum_curvature_radpm: 3.20
    maximum_curvature_rate_radpm2: 20.0

    # 제어기 단독 감속 시험 설정입니다. 로컬플래너는 글로벌 속도 프로파일을 그대로 유지합니다.
    # 큰 가속도 값은 곡률 속도 캡과 종방향 재프로파일을 실질적으로 비활성화합니다.
    # 경로 형상 안전성 검사(maximum_curvature_radpm 등)와 safe-stop 감속은 계속 적용됩니다.
    avoidance_speed_scale: 1.0
    maximum_lateral_accel_mps2: 1000000.0
    maximum_longitudinal_accel_mps2: 1000000.0
    maximum_longitudinal_decel_mps2: 1000000.0

    # 좌우 spline이 모두 트랙 경계/장애물/기하 검사를 실패할 때 장애물 앞에서 정지합니다.
    safe_stop_buffer_m: 0.80
    safe_stop_deceleration_mps2: 2.5
    minimum_path_points: 8

    # map-frame Cartesian AABB를 CLCS로 내부 투영한 정적 물체만 담당합니다.
    require_obstacles_message: true
    static_obstacles_only: true
    static_speed_threshold_mps: 0.25
    obstacle_stale_timeout_sec: 0.75
    odometry_stale_timeout_sec: 0.50

    # 설계된 spline merge 지점에 도달하고 실제 ego d도 글로벌 라인에 들어왔는지 확인합니다.
    # 이 확인만으로 commitment를 해제하지 않고, /state가 AVOID를 거쳐 GLOBAL로 돌아올 때까지
    # non-empty global tail을 계속 발행합니다.
    merge_lateral_tolerance_m: 0.15
    # planning_period_ms=25이므로 15회는 0.375초입니다.
    merge_confirm_cycles: 15
    # safe-stop 진입은 즉시 수행하고, 8회(0.2초) 연속 안전할 때만 해제합니다.
    safe_stop_release_cycles: 8
    planning_period_ms: 25
    # 기하 합류 후 전체 global loop를 회전해 발행합니다. state_machine은 ot_line의
    # raceline_global_handoff 표식을 우선 사용하며, 이 비율은 기존 tail 판정 호환용입니다.
    state_handoff_tail_ratio: 0.10
    state_handoff_speed_cap_mps: 6.0

    # 첫 blocking cluster는 즉시 횡이동하지 않고 준비 감속 경로로 잠깐 관측합니다.
    # 새 ID가 붙거나 AABB 합집합이 3 cm 이상 넓어지면 안정화 시간을 다시 셉니다.
    initial_cluster_stabilization_sec: 0.20
    initial_cluster_max_wait_sec: 0.35
    cluster_envelope_change_threshold_m: 0.03
    # 아래 횡/종방향 조건 중 하나에 도달하기 전에는 새 장애물 때문에 기존 방향이
    # 불가능해졌을 때 반대편을 한 번 더 평가합니다. 실제 회피 진입 뒤에는 방향을 고정합니다.
    commitment_lock_lateral_threshold_m: 0.10
    commitment_lock_longitudinal_m: 0.50

    # wpnt_publisher가 /avoid_waypoints를 /local_waypoints로 선택하므로 기본 중복 발행은 끕니다.
    publish_standalone_local: false
    obstacle_marker_scale_m: 0.35
    path_marker_width_m: 0.06

    global_waypoints_topic: "/global_waypoints"
    # obstacle_detector Layer 2 output. It contains only confirmed static objects.
    obstacles_topic: "/static_obs"
    frenet_odom_topic: "/car_state/frenet/odom"
    state_topic: "/state"
    ot_waypoints_topic: "/avoid_waypoints"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_planning/path"
    compatibility_path_topic: "/local_path"
    markers_topic: "/local_planning/markers"
    frame_id: "map"
