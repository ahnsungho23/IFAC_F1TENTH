    # map-frame Cartesian AABB를 CLCS로 내부 투영한 정적 물체만 담당합니다.
    require_obstacles_message: true
    static_obstacles_only: true
    static_speed_threshold_mps: 0.25
    obstacle_stale_timeout_sec: 0.75
    odometry_stale_timeout_sec: 0.50

    # 설계된 spline tail에 도달하고 실제 ego d도 글로벌 라인에 들어온 뒤 commitment를 해제합니다.
    merge_lateral_tolerance_m: 0.15
    # state_machine의 기본 enter_global_sec=0.5보다 긴 0.75초(20 Hz * 15회)를 유지합니다.
    merge_confirm_cycles: 15
    planning_period_ms: 25

    # wpnt_publisher가 /avoid_waypoints를 /local_waypoints로 선택하므로 기본 중복 발행은 끕니다.
    publish_standalone_local: false
    obstacle_marker_scale_m: 0.35
    path_marker_width_m: 0.06

    global_waypoints_topic: "/global_waypoints"
    obstacles_topic: "/perception/static_obstacles/cartesian"
    frenet_odom_topic: "/car_state/frenet/odom"
    ot_waypoints_topic: "/avoid_waypoints"
    local_waypoints_topic: "/local_waypoints"
    local_path_topic: "/local_planning/path"
    compatibility_path_topic: "/local_path"
    markers_topic: "/local_planning/markers"
    frame_id: "map"
