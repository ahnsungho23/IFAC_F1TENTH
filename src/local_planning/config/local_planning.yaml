local_planner_node:
  ros__parameters:
    # 가장 가까운 정적 장애물 군집만 계획합니다. 모든 거리는 글로벌 Race Line의 Frenet s/d 기준입니다.
    detection_lookahead_m: 12.0
    obstacle_cluster_gap_m: 0.8
    obstacle_longitudinal_padding_m: 0.3661363460730684

    # 장애물 경계는 raw detector geometry이므로 실제 차량 반폭, 물리 안전 마진, 실측
    # 추종오차 reserve를 모두 정확히 한 번 적용합니다.
    #
    #   차량 중심이 확보할 거리 = vehicle_half_width_m + safety_margin_m
    #                          + tracking_error_reserve_m
    #                          = 0.1435 + 0.0582293 + 0.140 = 0.3417293 m
    #
    # vehicle_half_width_m는 실차 폭 0.287 m의 반폭이며 마진이 아닙니다. safety_margin_m는
    # 물리 안전 여유, tracking_error_reserve_m는 동일 경로 1.5 m/s 반복 검증의 회피경로
    # 추종오차(max 0.1370 m, P99 0.1345 m)를 올림한 제어 여유입니다. 계산된 0.3417293 m를
    # 다음 세 곳에 똑같이 적용합니다.
    #   1. 장애물 좌/우 경계에서 회피 목표 d까지의 거리
    #   2. 글로벌 d=0을 막는 장애물인지 판단하는 거리
    #   3. commitment 경로를 raw 장애물과 즉시 충돌 검사할 때의 거리
    # global waypoint의 d_left/d_right는 차량 반폭과 벽 안전마진이 이미 반영된 차량 중심
    # 가용 한계입니다. 트랙 경계 검사에서는 추가 로컬 마진 없이 두 값을 그대로 씁니다.
    # 별도 obstacle/boundary/hard/fallback 마진은 더하지 않습니다.
    vehicle_half_width_m: 0.1435
    safety_margin_m: 0.058229308745201366
    tracking_error_reserve_m: 0.140
    fallback_track_half_width_m: 1.50

    # 진입/복귀 quintic 프로파일의 [먼 점, 중간 점, 가까운 점]과
    # [가까운 점, 중간 점, 먼 점] 표본 거리입니다. 먼 점은 각 프로파일의 전체 길이이고,
    # 중간/가까운 점의 d는 quintic 진행률로 점진적으로 계산되어 RViz 제어점에 표시됩니다.
    # 아래 값은 변경된 동일 장애물 배치에서 1.5 m/s CMA-ES 후 3회 연속 무충돌 완주한 후보입니다.
    pre_apex_distances_m: [9.0, 6.0, 3.0]
    post_apex_distances_m: [1.6471992864388174, 3.294398572877635, 4.9415978593164525]
    # 진입은 큰 scale부터 검사해 접근 여유를 사용하고, 복귀는 작은 scale부터 검사해 빠르게
    # 다음 maneuver를 준비합니다. 짧은 복귀가 기하 검사를 실패할 때만 복귀 scale을 늘립니다.
    transition_distance_scales: [0.2126428647700918, 1.074713915992601, 3.5]
    # 위 transition distance에 곱하는 배율입니다. 1보다 작으면 바깥쪽 회피 전환을 짧게,
    # 1보다 크면 길게 만듭니다. 현재 0.1은 선택된 진입/복귀 길이의 10%를 사용합니다.
    outside_line_transition_scale: 0.1
    # d=0 합류점 뒤 글로벌 점을 덧붙여 controller와 state machine이 handoff를 완료할 시간을 줍니다.
    # 실제 tail은 max(post_merge_lookahead_m, 계획 시 ego_speed * post_merge_min_time_sec)입니다.
    post_merge_lookahead_m: 5.0
    post_merge_min_time_sec: 1.0
    # 장애물이 매우 작거나 Race Line 한쪽에 치우쳐도 목표 d의 절댓값이 이 값보다 작아지지
    # 않게 하는 경로 형상 제한입니다. 장애물 안전 마진에 더하는 값은 아닙니다.
    minimum_target_offset_m: 0.15
    maximum_target_offset_m: 1.50
    # 좌우 후보 점수 차가 이 값 이하면 트랙 폭 여유(headroom)가 큰 쪽을 고릅니다.
    # reference 폭은 측정 jitter가 없어 정중앙 동점에서도 측면이 프레임마다 뒤집히지 않습니다.
    side_tie_epsilon_m: 0.02

    # 이동된 글로벌 점의 기하학적 주행 가능성 검사입니다.
    maximum_lateral_slope: 0.8
    # f1tenth_control의 ±0.41 rad 조향 한계와 wheelbase 0.3302 m에 대응합니다.
    maximum_curvature_radpm: 1.316266519079011
    maximum_curvature_rate_radpm2: 20.0

    # 좌우 spline이 모두 트랙 경계/장애물/기하 검사를 실패할 때 장애물 앞에서 정지합니다.
    # 정지 목표는 longitudinal padding까지 적용된 장애물 경계보다 0.40 m 앞입니다.
    # 현재 obstacle_longitudinal_padding_m=0.3661363이므로 detector 원본 AABB 앞 기준 nominal
    # 거리는 0.7661363 m이며, waypoint 표본 간격에 따라 실제 목표점은 이보다 조금 더 앞일 수 있습니다.
    safe_stop_buffer_m: 0.40
    safe_stop_deceleration_mps2: 2.5
    minimum_path_points: 8

    # map-frame Cartesian AABB를 CLCS로 내부 투영한 정적 물체만 담당합니다.
    require_obstacles_message: true
    # 한 번 유효하게 받은 뒤 이 시간이 지나면 degraded mode로 전환합니다. stale은 장애물 소멸로
    # 해석하지 않고 마지막 경로/스냅샷을 유지하며, 새 유효 배열(빈 배열 포함)이 기억을 교체합니다.
    obstacle_stale_timeout_sec: 0.75
    # Frenet 위치 자체가 stale이면 최악 상황으로 보고 마지막 위치에서 zero-speed hold를 발행합니다.
    odometry_stale_timeout_sec: 0.50

    # 설계된 spline merge 지점에 도달하고 실제 ego d도 글로벌 라인에 들어왔는지 확인합니다.
    # 이 확인만으로 commitment를 해제하지 않고, /state가 AVOID를 거쳐 GLOBAL로 돌아올 때까지
    # non-empty global tail을 계속 발행합니다.
    merge_lateral_tolerance_m: 0.15
    # planning_period_ms=25이므로 15회는 0.375초입니다.
    merge_confirm_cycles: 15
    # safe-stop 진입은 즉시 수행하고, 8회(0.2초) 연속 안전할 때만 해제합니다.
    safe_stop_release_cycles: 8
    planning_period_ms: 25
    # 기하 합류 후 전체 global loop를 회전해 발행합니다. state_machine은 ot_line의
    # raceline_global_handoff 표식을 우선 사용하며, 이 비율은 기존 tail 판정 호환용입니다.
    state_handoff_tail_ratio: 0.10
    state_handoff_speed_cap_mps: 6.0

    # 첫 blocking cluster는 실제 /static_obs 메시지에서 같은 ID를 3회 관측하고 최소 시간도
    # 지난 뒤 확정합니다. 고주기 detector의 연속 3개 메시지를 즉시 commitment하지 않습니다.
    initial_observation_count: 3
    initial_observation_min_duration_sec: 0.15
    initial_observation_max_wait_sec: 0.35
    # 아래 값은 차량과 물체 사이의 물리 안전 마진이 아닙니다. detector 측정값이 실제 물체를
    # 포함하도록 raw AABB 자체를 넓혀 uncertainty Guard를 만드는 관측 모델 파라미터입니다.
    # 처리 순서는 raw AABB -> uncertainty Guard -> 차량 반폭+safety_margin+tracking reserve
    # 검사이며, 세 항은 마지막 단계에서 정확히 한 번만 적용됩니다.
    uncertainty_sigma_scale: 3.0
    uncertainty_min_longitudinal_inflation_m: 0.05
    uncertainty_min_lateral_inflation_m: 0.03
    # 초기 검출의 큰 중심 분산이 Guard를 과도하게 키워 정중앙 장애물의 양쪽 목표 d를
    # 모두 불가능하게 만드는 것을 막는 횡방향 Guard 팽창 상한입니다.
    uncertainty_max_lateral_inflation_m: 0.15
    # soft/hard 충돌 모두 같은 0.3417293 m 계획 clearance를 사용합니다. 차이는 추가 마진이 아니라
    # 검사 대상뿐입니다: uncertainty Guard 침범은 soft, detector raw AABB 침범은 hard입니다.
    commitment_soft_violation_confirm_cycles: 3
    # 안전 마진이 아니라 maneuver 상태 전환용 종방향 거리입니다. 첫 장애물 Guard의 뒤쪽을
    # 이 거리만큼 완전히 지난 뒤 다음 maneuver가 현재 commitment를 선점할 수 있습니다.
    chain_release_distance_m: 0.20
    # 아래 횡/종방향 조건 중 하나에 도달하기 전에는 새 장애물 때문에 기존 방향이
    # 불가능해졌을 때 반대편을 한 번 더 평가합니다. 실제 회피 진입 뒤에는 방향을 고정합니다.
    commitment_lock_lateral_threshold_m: 0.10
    commitment_lock_longitudinal_m: 0.50

    global_waypoints_topic: "/global_waypoints"
    # obstacle_detector Layer 2 output. It contains provisional/confirmed static objects.
    obstacles_topic: "/static_obs"
    frenet_odom_topic: "/car_state/frenet/odom"
    state_topic: "/state"
    ot_waypoints_topic: "/avoid_waypoints"
    local_path_topic: "/local_planning/path"
    frame_id: "map"
