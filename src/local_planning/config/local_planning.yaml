    # 반환하지 않고 hard constraint 통과 후보를 normalized safety slack으로 순위화합니다.
    entry_transition_fractions: [0.5145810930150512, 0.75, 1.00]
    # 기존 이름을 호환성 때문에 유지하지만 이 값은 이제 exit에만 사용합니다.
    transition_distance_scales: [0.4971684162574945, 0.6991537701867223, 3.698773101198193]
    # 바깥쪽 회피의 exit에만 곱합니다. entry와 exit 의미를 다시 결합하지 않습니다.
    # 0.1(구 CMA 산출값)은 outside 라인 exit 길이를 ×0.1로 줄여 long-scale 프로브 하나를
    # 제외한 모든 outside exit이 곡률 검증(3.2 rad/m)을 통과할 수 없는 죽은 값이었습니다.
    # v2 파라미터 공간 하한 0.35에 맞춰 baseline을 0.5로 올렸습니다 (validate_baseline 계약).
    # 0.406 = CMA v4 최적 후보 (2026-08-13, 16x16, fitness -0.9477; 일반체인 FINALS
    # lap_complete 11.28s·최소여유 0.269m 검증 — runs/cmaes_tuning/p3_hybrid_p0_cma_v4).
    outside_line_transition_scale: 0.4060036444074003
    # d=0 합류점 뒤 글로벌 점을 덧붙여 controller와 state machine이 handoff를 완료할 시간을 줍니다.
    # 실제 tail은 max(post_merge_lookahead_m, 계획 시 ego_speed * post_merge_min_time_sec)입니다.
    post_merge_lookahead_m: 5.0
    post_merge_min_time_sec: 1.0
    # 완료 핸드오프의 계획된 복귀 램프(2026-08-13): ego의 현재 d에서 0까지 smoothstep으로
    # 내려가는 구간을 글로벌 핸드오프 앞머리에 접붙입니다(실차의 느린 자연 복귀 0.055 m/m
    # 대책). 길이 = max(min_length, |v| * time). 🔴 현재 0 = 비활성: 시뮬 회귀에서 벽
    # 협착부 최소 여유를 0.117→0.082 m로 깎았고, 벽 클램프는 웨이포인트 경계의 낙관
    # (실측 0.16~0.23 m) 때문에 물리지 않았습니다. 제어팀 섹터별 벽 여유 실측으로 경계를
    # 보정한 뒤 3.0 / 1.5로 활성화 검토 (docs/local_planner.md 참고).
    merge_ramp_min_length_m: 0.0
    merge_ramp_time_sec: 0.0
    # 장애물이 매우 작거나 Race Line 한쪽에 치우쳐도 목표 d의 절댓값이 이 값보다 작아지지
    # 않게 하는 경로 형상 제한입니다. 장애물 안전 마진에 더하는 값은 아닙니다.
    minimum_target_offset_m: 0.15
    maximum_target_offset_m: 1.50
    # obstacle-clearance 최소 target과 track-bound 최대 target 사이의 균등 표본 수입니다.
    target_d_candidate_count: 5
    # 이동된 글로벌 점의 기하학적 주행 가능성 검사입니다.
    maximum_lateral_slope: 0.8
    # 진입 불연속 검사의 추종오차 예산 하한 [m] (2026-08-20 신설).
    # 그 검사는 (간격 > 예산) AND (간격/진입거리 > maximum_lateral_slope) 입니다. 예산은
    # localization_reserve_m + tracking_error_lut 인데 둘 다 **장애물 마진 정책**의 값이라,
    # 마진을 0 으로 두면 예산이 0 이 되어 첫 조건이 상시 참이 되고 AND 가 무너집니다.
    # 2026-08-19 run_001453 실측: P3 기동 무효화 36 건 중 24 건(67%)이 이 검사였고 생성 후
    # p50 110 ms 만에 무효화 → 안전정지 자율 시간의 24%, 경로 d 부호 전환 43 회로 이어졌습니다.
    #
    # 🔑 값 기준은 추종오차 크기가 아니라 **진입점까지의 거리**입니다. 기각은
    #    간격 > 0.8·진입거리 일 때 나므로, 하한 F 가 그 오탐을 덮으려면 진입거리 < F/0.8
    #    이어야 합니다. 같은 백의 진입거리 분포(발행 8938 건):
    #      p10 0.031  p25 0.069  p50 0.138  p75 0.205  p90 0.243 m
    #    하한별 덮이는 비율: 0.10→45.2%  0.15→67.8%  **0.20→92.8%**  0.25→92.9%  0.30→93.0%
    #    0.20 에서 포화하므로 그 위는 진짜 불연속 탐지만 무뎌집니다.
    # 진짜 불연속(코드가 명시한 실해 사례 간격 0.447 m)은 이 하한의 2.2 배라 그대로 걸립니다.
    # 0 으로 두면 하한이 꺼져 종전(마진 종속) 거동으로 돌아갑니다.
    # ⚠️ 마진이 살아 있는 구성(예: mongsen, 예산 0.215~0.485 m)에서는 이 하한이 걸리지
    #    않으므로 거동이 바뀌지 않습니다.
    entry_discontinuity_min_budget_m: 0.20
    # f1tenth_control의 ±0.41 rad 조향 한계와 wheelbase 0.3302 m에 대응합니다.
    maximum_curvature_radpm: 1.316266519079011
    maximum_curvature_rate_radpm2: 20.0

    # 좌우 spline이 모두 트랙 경계/장애물/기하 검사를 실패할 때 장애물 앞에서 정지합니다.
    # 정지 목표는 longitudinal padding까지 적용된 장애물 경계보다 safe_stop_buffer_m 앞입니다.
    # 현재 obstacle_longitudinal_padding_m=0.4149925이므로 detector 원본 AABB 앞 기준 nominal
    # 거리는 buffer + 0.4149925 m이며, waypoint 표본 간격에 따라 실제 목표점은 조금 더 앞일 수 있습니다.
    #
    # 🔴 0.40 → 1.20 (2026-08-14 실차): 정지 자체는 옳게 했는데 **정지 후 스스로 못 빠져나가
    # 사람이 E-stop으로 구조한 사건이 5건 중 3건**이었습니다(run_0814_145423 t=110.2는 12.7초
    # 대기). 원인은 횡방향 간극 부족이 아닙니다 — 그 지점 통과에 필요한 여유가 0.39 m인데
    # 왼쪽 0.49 / 오른쪽 0.90 m로 **지나갈 공간은 있었고**, 차가 박스 0.53~0.78 m 앞에 서는
    # 바람에 **정지 상태에서 회피 곡선을 만들 진입 거리(≈1.5 m)가 없었던 것**입니다. 버퍼를
    # 키우면 정지점이 그만큼 뒤로 물러나 탈출 진입 거리가 생깁니다.
    #
    # 🔴 1.20 → 2.60 (2026-08-14 저녁, 젯슨 백 7개). 1.20은 여전히 탈출 임계보다 작아서
    # **모든 safe-stop이 구조적으로 영구 교착**이었다. 하니스로 세 교착 지점의 임계를 쟀다
    # (장애물 s_start 기준 몇 m 앞까지 회피 경로가 생성되는가):
    #   s=27.2 장애물: 1.6 m 앞 kNoSafePath / 1.9 m 앞 kAvoidance
    #   s= 2.1 장애물: 2.0 m 앞 kNoSafePath / 2.5 m 앞 kAvoidance
    #   s= 2.13 장애물: 1.8 m 앞 kNoSafePath / 2.5 m 앞 kAvoidance
    # 즉 임계는 2.0~2.5 m인데 정지점은 1.20 m였다. 실제 run_0101_090639에서 차는 장애물
    # 1.6 m 앞(s=25.84)에 서서 28.8초 동안 못 나왔다 — 그 지점에서 좌 1.17 m / 우 1.36 m로
    # **횡방향 공간은 충분했는데도** 진입 거리가 없어 후보가 0개 생성됐다.
    # 2.60 = 측정 임계 상한 2.5 + 여유 0.1.
    #
    # 이 값은 손으로 맞춘 상수라 기하가 바뀌면 깨진다. 그래서 아래 탈출 검증이 함께 있다 —
    # 버퍼는 "보통 이 정도면 된다"는 출발점이고, 실제 보증은 검증이 한다.
    safe_stop_buffer_m: 2.60

    # 🔴 정지점 탈출 검증 (2026-08-14 신규). 정지점을 확정하기 전에 그 지점에서 v=0으로
    # 회피 경로가 생성되는지 확인하고, 안 되면 탈출 가능한 가장 늦은 지점까지 물린다.
    # 탈출 가능성은 정지점을 뒤로 물릴수록 단조 증가하므로(진입 거리가 길어진다) 선형
    # 후퇴가 아니라 이분탐색을 쓴다. 어느 지점에서도 불가능하면 원래 정지점을 유지하고
    # reason에 경고를 남기며 노드가 ERROR를 찍는다 — 이전에는 30초씩 조용히 매달렸다.
    #
    # 비용(랩톱 실측, plan() 1회): 회피가 성립하는 정상 경로는 7.40 → 7.55 ms로 사실상
    # 변화 없다(검증은 안전정지 경로에서만 호출된다). 탈출이 아예 불가능한 최악의
    # 안전정지 경로가 5.30 → 14.85 ms다(선형 후퇴 초안은 같은 조건에서 23.80 ms였다).
    # 매 탐침마다 정지점 기준으로 장애물을 다시 확장해야 하므로(아래 좌표계 주의) 이보다
    # 더 줄이기 어렵다.
    # ⚠️ 좌표계: ExpandedObstacle의 거리들은 **자차 상대**다. 정지점 기준 판정을 하려면
    #    절대 s 원본으로 재확장해야 한다. 재확장을 빼면 검증이 조용히 무의미해진다
    #    (2026-08-14 리뷰에서 실제로 이 상태로 커밋됐다가 수리).
    # ⚠️ 젯슨은 더 느리므로 안전정지 중 루프 지연이 관측되면 아래 enable을 false로 두면
    #    이전 동작(정지점 무검증)으로 즉시 돌아간다.
    safe_stop_escape_check_enable: true
    # 이분탐색 해상도[m]와 최대 탐침 횟수. 흔한 경우 1회, 가망 없는 경우 2회로 끝난다.
    safe_stop_escape_retreat_step_m: 0.30
    safe_stop_escape_max_retreats: 8
    # 🔴 2.5 → 1.8 (2026-08-14 실차): 이 값은 정지 prefix의 감속 프로파일 권한인데, 실측
    # 감속이 못 따라와 **정지점을 지나쳐 장애물 s 구간 안까지 밀고 들어간** 사례가 있습니다
    # (run_0814_145311 t=38: 2.22 m/s에서 1.11 m 앞 장애물 인지 → 실측 감속 ~1.7 m/s²로
    # 0.54 m 오버슛, 박스 옆에 정지 = 완전 교착). 낙관적 권한은 버퍼를 그대로 잡아먹으므로
    # 실측치에 맞춥니다. 낮출수록 제동을 더 일찍 시작하는 보수적 방향입니다.
    safe_stop_deceleration_mps2: 1.8
    minimum_path_points: 8

    # map-frame Cartesian AABB를 CLCS로 내부 투영한 정적 물체만 담당합니다.
    require_obstacles_message: true
    # 한 번 유효하게 받은 뒤 이 시간이 지나면 degraded mode로 전환합니다. stale은 장애물 소멸로
    # 해석하지 않고 마지막 경로/스냅샷을 유지하며, 새 유효 배열(빈 배열 포함)이 기억을 교체합니다.
    obstacle_stale_timeout_sec: 0.75
    # Frenet 위치 자체가 stale이면 최악 상황으로 보고 마지막 위치에서 zero-speed hold를 발행합니다.
    odometry_stale_timeout_sec: 0.50

    # 설계된 spline merge 지점에 도달하고 실제 ego d도 글로벌 라인에 들어왔는지 확인합니다.
    # 이 확인만으로 commitment를 해제하지 않고, /state가 AVOID를 거쳐 GLOBAL로 돌아올 때까지
    # non-empty global tail을 계속 발행합니다.
    merge_lateral_tolerance_m: 0.15
    # planning_period_ms=25이므로 15회는 0.375초입니다.
    merge_confirm_cycles: 15
    # safe-stop 진입은 즉시 수행합니다. 이 8회는 동일 obstacle의 selectable hard-valid avoidance
    # 또는 정지 후 explicit corridor-clear 관측의 보조 debounce이며, empty array는 집계하지 않습니다.

    safe_stop_release_cycles: 8
    planning_period_ms: 25
    # 기하 합류 후 전체 global loop를 회전해 발행하며, 경로 끝에서 이 호 길이[m]만큼의
    # tail 구간 첫 점에 ego를 놓습니다. state_machine의 enter_global_tail_distance_m와
    # **같은 값이어야** 합니다. FSM은 ot_line=raceline_global_handoff 표식이 있어야만
    # GLOBAL 복귀 검사를 평가하고(2026-08-16 계약), 그 검사가 이 tail 창을 사용합니다.
    state_handoff_tail_distance_m: 6.0
    state_handoff_speed_cap_mps: 6.0

    # 첫 blocking cluster는 실제 /static_obs 메시지에서 같은 ID를 3회 관측하고 최소 시간도
    # 지난 뒤 확정합니다. 고주기 detector의 연속 3개 메시지를 즉시 commitment하지 않습니다.
    initial_observation_count: 3
    initial_observation_min_duration_sec: 0.15
    initial_observation_max_wait_sec: 0.35
    # 종방향 불확실성은 접근 및 정지 시점을 보수적으로 잡는 용도로 유지합니다. 횡방향은 detector
    # raw d_right/d_left를 그대로 사용하도록 최소/최대 팽창을 모두 0으로 둡니다. 따라서 횡방향
    # 검사는 raw AABB + 차량 반폭 + safety_margin + tracking-error LUT만 적용합니다.
    # [PROTOTYPE] 원래 3.0 — 불확실성 가드. 제거.
    uncertainty_sigma_scale: 0.0
    # [PROTOTYPE] 원래 0.05 — 가드 종방향 팽창. 제거.
    uncertainty_min_longitudinal_inflation_m: 0.0
    # 횡방향 Guard 팽창 (2026-08-16, 종전 0/0): 측면 통과 중에는 라이다가 통과측 면만
    # 보게 되어 raw face가 통과측으로 드리프트한다(13:52 백 실측 12 cm: -0.209→-0.332).
    # 팽창 0이면 그 드리프트가 동결 Guard를 즉시 벗어나고 raw 재검증이 리텐션 기준
    # 1.3 cm 차로 실패해 옆구리에서 커밋이 죽는다(정지 5 s). min을 올리면 ①커밋 목표가
    # 그만큼 깊어져 드리프트에도 raw 간격이 살아남고 ②동결 Guard가 드리프트를 흡수한다.
    # 실효 팽창 = min(min + 3σ_d, max). 3σ_d≈0.03이므로 이 설정의 실효값은 0.13이며
    # (관측 드리프트 0.12를 동결 Guard가 완전히 흡수), 분산이 커지면 max 0.15에서 멈춘다.
    #
    # 🔴 2026-08-16 14:30 백에서 이 설정의 실해가 드러났다. 위 두 값은 "불확실성"이라는
    # 이름을 달았지만 실제로는 상수다: 실측 3σ_d는 0.077~0.099뿐이라 실효값이 언제나
    # 0.13~0.15로 고정된다. 게다가 d_var는 박스 *중심*의 분산 하나이고 그것을 양 *면*에
    # 대칭으로 물린다. 그런데 면별 실측 σ는 자릿수가 다르다:
    #   장애물 2 — 라인 쪽 면 0.007 (최악 0.025) / 반대쪽 면 0.044 (최악 0.133)
    #   장애물 0 — 라인 쪽 면 0.051            / 반대쪽 면 0.114 (최악 0.211)
    # 즉 중심 분산 0.012는 어느 면도 대표하지 못한다. 정확히 측정된 라인 쪽 면에까지
    # 0.14를 걷어간 결과, 실여유 0.84 m(필요 0.64 m)인 간격이 계획 불가가 되어 차가
    # s=12.28에서 영구 정지했고 사람이 포즈를 옮겨 꺼내야 했다. 하니스 실측 임계는
    # 팽창 0.07 통과 / 0.10 실패로, 이 설정은 정확히 절벽 위에 있었다.
    #
    # 그래서 팽창을 면별 실측으로 바꾼다(uncertainty_measured_lateral_floor_m 이하).
    # 아래 두 값은 이제 **면 이력이 아직 부족할 때의 사전분포**로만 쓰인다 — 위 문단의
    # 커밋 중도사망 방지 논리는 그대로 유효하므로 값은 유지한다.
    # [PROTOTYPE] 원래 0.10 — 가드 횡방향 팽창. 제거.
    uncertainty_min_lateral_inflation_m: 0.0
    # [PROTOTYPE] 원래 0.15 — 가드 횡방향 상한. 제거.
    uncertainty_max_lateral_inflation_m: 0.0
    # 면 이력이 충분히 쌓인 뒤의 팽창 = clamp(3σ_면, floor, max 0.15).
    # floor가 0.10이 아니라 0.02인 이유: 바닥이 더 이상 "트랙에서 가장 잡음이 큰 면"을
    # 커버할 필요가 없다. 잡음이 큰 면은 자기 σ로 커버되고(장애물 0 반대쪽 3σ=0.34 →
    # max 0.15로 클램프 = 종전과 동일), 조용한 면은 자기 σ로 풀려난다(장애물 2 라인 쪽
    # 3σ=0.021). floor는 검출기 양자화만 덮으면 된다.
    uncertainty_measured_lateral_floor_m: 0.02
    # 최근 창을 쓰는 이유: 박스는 접근하면서 정당하게 자란다(장애물 2의 라인 쪽 면이 7 m
    # 에서 -0.156, 6 m 안쪽에서 -0.278로 수렴). 전체 이력 분산은 그 성장을 영원히 기억해
    # 수렴 후에도 크게 남고, 최근 창은 성장 중 크고 수렴 후 작아져 "지금 이 면을 얼마나
    # 믿을 수 있나"를 그대로 나타낸다. 40 샘플 ≈ 1 s (검출기 40 Hz).
    uncertainty_face_window_samples: 40
    # 이 개수 미만이면 면 σ를 신뢰하지 않고 위 상수 경로를 쓴다. 12 ≈ 0.3 s.
    uncertainty_face_min_samples: 12
    # soft/hard 충돌 모두 같은 0.2982893 m 계획 clearance를 사용합니다. 차이는 추가 마진이 아니라
    # 검사 대상뿐입니다: uncertainty Guard 침범은 soft, detector raw AABB 침범은 hard입니다.
    commitment_soft_violation_confirm_cycles: 3
    # 안전 마진이 아니라 maneuver 상태 전환용 종방향 거리입니다. 첫 장애물 Guard의 뒤쪽을
    # 이 거리만큼 완전히 지난 뒤 다음 maneuver가 현재 commitment를 선점할 수 있습니다.
    chain_release_distance_m: 0.07665532758837189
    # 🔴 커밋 래치 거리 [m] (2026-08-20 신설).
    # 커밋한 장애물이 전방 이 거리 안에 있으면 "이번 프레임 미검출"을 이유로 글로벌
    # 핸드오프(= d 오프셋 0 인 라인)로 넘어가지 않습니다. 여기서 라인으로 복귀하는 것은
    # 회피 포기가 아니라 충돌입니다.
    #
    # 근거 — 2026-08-19 run_034444 실차(자율 343 s):
    #   원거리 LiDAR 각해상도의 한계로 클러스터가 min_cluster_points(5) 문턱을 넘나듭니다.
    #   폭 0.45 m 물체가 10 m 에서 각폭 2.6° = 약 10 빔뿐이고, 코너 차체 롤 6~12° 가
    #   그중 일부를 빗나가게 합니다. 실측 미검출률(직전 1 s 내 관측 기준):
    #     3~5 m 42.2%   5~7 m 47.7%   7~10 m 65.9%   (3~10 m 전체 50.9%)
    #   깜빡임은 물리적 한계라 못 없앱니다. 문제는 플래너가 그 한 프레임을 "장애물 없음"
    #   으로 읽고 d=0 핸드오프를 발행하는 것이고, 재검출돼도 그 id 는
    #   buildNextManeuverInput() 의 excluded 에 있어 재회피가 막힙니다.
    #   실제로 장애물 0.35~1.35 m 앞까지 오프셋 0 을 유지한 정면 충돌이 5 건이었습니다
    #   (t=244.1 / 276.6 / 278.3 / 341.2 / 545.2, 3.8~5.7 m/s).
    #
    # 값 8.0: 미검출이 시작되는 거리대(3~10 m)를 덮고 5 m/s 정지거리(6~7 m)보다 큽니다.
    # edge_test 의 avoid_planner 는 같은 개념을 latch_commit_distance_m 5.0 으로 넣었는데,
    # 그쪽 미검출률 7.9% 는 우리(50.9%)의 1/6 이라 더 크게 잡습니다.
    # 0 이면 래치가 꺼지고 종전 거동(미검출 즉시 핸드오프)으로 돌아갑니다.
    handoff_latch_commit_distance_m: 8.0
    # 🔴 완료 보류 상한 [s] (2026-08-20 신설).
    # P3 가 "기동 완료"를 선언해도 기동 장애물의 뒤끝이 아직 자차 앞에 있으면 완료를
    # 보류합니다(핸드오프로 넘어가면 d 오프셋 0 으로 그대로 들이받습니다). 다만 차가
    # 멈춰 있으면 장애물을 영영 못 지나 보류가 안 풀리고 FSM 이 AVOID 에 갇히므로,
    # 이 시간을 넘기면 강제로 완료시킵니다.
    #
    # 근거 — 2026-08-19 run_045534 실차(자율 322 s): 완료 분기가 41 회 실행됐고 장애물이
    # 특정된 13 건 중 11 건(85%)이 **아직 안 지나간 상태**였습니다(뒤끝까지 전방거리
    # p50 +0.32 m, p90 +7.53 m; 5~10 m 앞에 두고 완료한 것이 3 건). t=79.2 에 id12 를
    # 6.98 m 앞에 두고 완료 선언한 뒤 1.2 초간 6.0 m/s 로 오프셋 0 을 유지하다 t=80.4 에
    # 정면 충돌했습니다. 자율 충돌 6 건(연속 충격 병합 기준)이 모두 이 형태입니다.
    completion_defer_max_sec: 3.0
    # 아래 횡/종방향 조건 중 하나에 도달하기 전에는 새 장애물 때문에 기존 방향이
    # 불가능해졌을 때 반대편을 한 번 더 평가합니다. 실제 회피 진입 뒤에는 방향을 고정합니다.
    commitment_lock_lateral_threshold_m: 0.10
    commitment_lock_longitudinal_m: 0.50

    global_waypoints_topic: "/global_waypoints"
    # obstacle_detector Layer 2의 confirmed-only 출력입니다 (2026-08-16 전환).
    # /static_obs는 CONFIRMED+UNKNOWN provisional 객체까지 포함해, 정지 증거를 모으기 전의
    # 벽 조각/산란 클러스터도 계획 입력이 됩니다. /confirmed_static_obs는 map-frame 위치
    # 지속성(static_vote 10/15, static_max_position_rms 0.10 m, 최소 10관측)까지 통과한
    # 객체만 싣습니다. track/ID는 동일하므로 initial_observation_count 등 ID 기반 계약은
    # 그대로 유효합니다. 유령 회피를 줄이는 대신 실제 장애물 첫 반응이
    # static_min_observations 만큼(250 Hz LiDAR 기준 ~40 ms) 늦어집니다.
    obstacles_topic: "/confirmed_static_obs"
    frenet_odom_topic: "/car_state/frenet/odom"
    state_topic: "/state"
    ot_waypoints_topic: "/avoid_waypoints"
    local_path_topic: "/local_planning/path"
    frame_id: "map"

    # CMA timing audit companion events. Disabled in normal runtime and does not alter planning.
    timing_diagnostics_enable: false
    timing_diagnostics_topic: "/cma_timing/events"
    # Deterministic record/replay audit companion stream. Disabled in production; it only reports
    # already-made stabilization/commitment decisions.
    replay_diagnostics_enable: false
    replay_diagnostics_topic: "/cma_replay/planner_events"
    # CMA 전용 exact-stamp obstacle/Frenet/state event mode.
    lockstep_mode: false

    # Production P3/M1 integration mode. TEST_ACTIVE(P3 주도 + P0 백업)가 기본 주행 모드입니다
    # (2026-08-12). OFF bypasses the P3 evaluator/lifecycle entirely. SHADOW evaluates the same
    # callback snapshot but only publishes the separate diagnostic stream. TEST_ACTIVE may publish
    # an exact-hard-valid P3/M1 path or current-hard-valid committed suffix; the unchanged P0 path
    # remains BACKUP_ONLY.
    p3_mode: "TEST_ACTIVE"
    # 회피 후보 생성기는 P3(analytic corridor) 하나다 (2026-08-15, P0 quintic 격자 삭제).
    # plan()과 안전정지 탈출 검증이 같은 P3 생성기를 쓰고, P3가 출력을 못 내면 곧바로
    # 기존 폴백 사다리(margin slow pass → safe stop)로 간다.
    # P3는 P0 시절의 안전 계층을 그대로 직접 호출한다:
    #    expandVisibleObstacles(추종오차 LUT + localization_reserve),
    #    validateCandidate(회전 footprint + wall_safety_margin),
    #    applyAvoidanceVelocityLimit(gap 기반 속도 제한), measureCandidate.
    #    안전정지(buildSafeStop + 탈출 검증)도 그대로다. 위 튜닝 값은 전부 살아 있다.
    p3_diagnostics_topic: "/local_planning/p3_shadow"
