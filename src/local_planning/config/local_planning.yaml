    # 때문에 장애물 span 뒤에도 cap을 유지합니다. 종전 C++ 하드코딩 +1.0 m를 값 변화 없이
    # 파라미터화한 것이며, 위 hold_sec(시간)와 다른 값입니다.
    raw_slowdown_post_hold_distance_m: 1.0
    # 라인 간섭 판정용 봉투 팽창 (차 반폭 0.15 + 벽 마진 0.10). 이보다 라인에서 먼
    # 물체(벽가 잔재)는 감속시키지 않는다.
    raw_slowdown_lateral_margin_m: 0.25
    # raw 검출이 계획·state·control 을 거쳐 실제 종방향 응답으로 이어질 때까지의 여유.
    # 🔵 2026-08-24 실차 백 실측으로 근거를 교체했습니다 (값은 유지):
    #   소프트웨어 체인  /static_obs→/avoid_waypoints→/local_waypoints→/drive   p50 31~39 ms
    #   구동계 응답      명령속도→실측속도 상호상관 (백 5개, 상관 0.44~0.58)     p50 30~40 ms
    #   합계 p50 ≈ 70~80 ms → 0.15 s 는 그 약 2 배의 보수 여유입니다.
    # ⚠️ 종전 주석의 "planning 20 Hz / 세 주기"는 틀렸습니다. planning_period_ms=25 이고
    #    백 실측 /avoid_waypoints 는 정확히 40.0 Hz 입니다 (0.15 s = 6 주기).
    # 이 값을 줄여도 7.2 m/s 에서 버는 거리는 0.36 m 뿐이라 d_need 부족의 해법이 아닙니다.
    raw_slowdown_response_delay_sec: 0.15
    # waypoint/장애물 앞면 이산화와 위 지연 추정의 잔여 오차를 흡수하는 계획거리.
    # d_need = v*delay + (v^2-v_target^2)/(2*a) + margin에만 사용합니다.
    raw_slowdown_distance_margin_m: 0.50
    # 🔴 2026-08-22: 이 힌트를 선언된 목적("승격 지연 메우기")으로 되돌린다.
    # 종전에는 승격이 끝나고 회피 기동을 커밋한 뒤에도 같은 장애물에 계속 2.8 캡이 걸렸다.
    # 예약 게이트를 끄면 갭 사다리가 죽어 이 캡이 **유일하게 남는** 장애물 캡이 되므로,
    # 그대로 두면 통과 속도가 2.80 에 고정된다 (run_20260822_015820 id12 의 8~12 m
    # 발행값이 정확히 2.80). 스팬 안 최저 캡 주체 실측: 갭 69.5% / raw 7.3%.
    # 건너뛰는 조건은 "지금 confirmed" AND "지금 커밋된 기동이 책임짐" 둘 다일 때뿐이라,
    # 미승격 raw·커밋 밖 다음 장애물·승격 무산 물체는 그대로 캡이 걸린다 —
    # run_102718 s5.5 충돌이 도입 근거였던 보호 경로는 유지된다.
    raw_slowdown_skip_committed: true

    # 2026-08-23: legacy 거리 스케일 A/B 게이트입니다.
    # true의 v_cap=max(2.8,sqrt(2*a*front))은 "현재 위치에서 허용할 속도"를 장애물 지점
    # 목표속도 자리에 넣습니다. applyRawSlowdownProfile이 다시
    # sqrt(cap^2+2*a*(front-forward))를 적용하므로 같은 전방거리가 두 번 들어가고,
    # d>1.96 m에서 자차 위치 상한이 물리 제동 envelope보다 sqrt(2)배 부풀어납니다.
    # false면 장애물 지점 목표는 항상 raw_slowdown_speed_cap_mps(2.8)이고 거리 스케일은
    # profile 한 곳에서만 적용됩니다. true는 과거 A/B 재현용으로만 남깁니다.
    # 이 키는 launch.py의 DeclareLaunchArgument로 노출되어 있지 않습니다. 운영 변경은 이
    # YAML(symlink-install)을 수정하거나 ROS parameter override를 사용하십시오.
    raw_slowdown_distance_scaled: false
    # 발행 직전 outgoing_path를 수정하지 않고 횡가속/가감속 feasibility 위반을 경고합니다.
    publish_feasibility_diagnostics_enable: true
    # F1 (2026-08-22): 보류 게이트(holdForManeuverObstacleAhead)가 커밋 경로를 못 쓸 때
    # **마지막으로 발행된 유효 회피 기하**를 지금 ego 로 재검증해 계속 쓸지.
    #
    # 왜 켜는가: 그 게이트의 유일한 복구원이던 committed_result_ 는 P3(TEST_ACTIVE, 현행
    # 운영) 에서 **구조적으로 항상 비어 있다** — 활성 기동은 makeP3ActiveResult() 로 곧장
    # 발행되고 commitAvoidance() 를 거치지 않기 때문이다. 그래서 이 게이트는 사실상 무조건
    # 안전정지였다. 실차 실측(run_20260822_072312 254.6 s + run_20260822_073013 122.7 s):
    #   「기동종료 보류」 18 회 → 안전정지 16 회 → 그중 13 회의 사유가 "커밋 경로 없음".
    #   그 결과 발행 경로가 65 점 → 3 점(0.50 m) 으로 붕괴했고, 열린 경로 끝점에 물린 L1 이
    #   요구 횡가속 32.2 m/s²(그립 예산 6.80)를 냈다 (073013 t=93.7, IMU 1.52 g).
    #
    # 안전 경계 두 겹: ① 같은 validatePath 를 지금 ego·지금 스냅샷으로 다시 통과해야 하고,
    # ② 앞에 minimum_path_points 이상 남아 있어야 한다. ②가 없으면 validatePath 가 최소점수를
    # 1 로 덮어쓰기 때문에(committed 재검증용) 1~2 점짜리 퇴화 경로가 다시 나간다.
    # false 로 두면 종전 거동으로 정확히 되돌아간다 — 재생 A/B 와 실차 롤백용.
    # 🟢 2026-08-22 실차 A/B/C 검증 완료 — F1+F3(=C팔) 이 기본값이다.
    #    A(둘 다 끔) 138.4 s / B(F1만) 49.8 s / C(F1+F3) 62.9 s, 자율 구간만:
    #      주행속도(거리/자율시간)  A 1.89  B 2.39  **C 2.51 m/s**  (A 대비 +33%)
    #      정지경로 스팬<L1        A 57.5% B 93.1% **C 0.0%**
    #      플래너 책임 정지         A 1.5%  B 0.0%  C 0.1%   (정지의 96%는 컨트롤 몫)
    #    ⚠️ F1 만 켜면(B) 정지가 늦게 걸려 더 짧은 접두부가 남아 퇴화 경로가 **늘어난다**
    #       (93.1%). F1 과 F3 은 세트로 쓴다 — 한쪽만 켜지 말 것.
    hold_republish_last_guidance: true
    # 컨트롤러가 L1 목표를 고를 수 있으려면 경로가 ego 앞으로 뻗어야 하는 거리 [m].
    # 컨트롤러의 walk_forward 는 **열린 경로에서 끝점에 멈춘다**. 그래서 경로가 짧으면 L1
    # 목표가 그 끝점이 되고, 전방 0.18 m / 횡 0.48 m 면 요구 횡가속이
    #   2·v²·sin(η)/L1 = 2·4.60²·sin(69.4°)/1.25 = 31.7 m/s²  (그립 예산 6.80)
    # 이 된다. run_20260822_073013 t=93.7 의 컨트롤러 로그가 32.17 이고, d 가 −0.05 →
    # +0.94 (1.0 m) 로 튀며 IMU 1.52 g 를 찍었다.
    #
    # 값 근거: L1 = l1_offset + v·l1_speed_gain = 0.6 + 0.32·v (f1tenth_control 기본값).
    #   v=4.6 → 2.07 m,  v=5.9 → 2.49 m.  2.5 는 우리가 낼 속도 전 구간을 덮는다.
    # 하한을 넘겨 더 긴 것은 공짜다 — 덧붙는 점은 전부 vx=0 이라 컨트롤러가 더 가까운 점을
    # 고를 뿐이다. F1(재발행)과 F3(정지 기하)이 같은 질문을 하므로 상수를 공유한다.
    # 0 이면 두 하한이 모두 꺼진다.
    controller_lookahead_floor_m: 2.5
    # F3 (2026-08-22): 접촉점에서 잘려 나간 정지 경로의 **조향 기하**를 원본으로 되돌릴지.
    #
    # 안전정지 생성기(buildCommittedPathStop / buildLastPathBrake)는 정지 목표를 첫 접촉
    # 지점 이전으로 자른다 — 종방향으로는 그것이 옳다(2026-08-16 의 "장애물 뒤에 정지목표"
    # 충돌 4 회를 고친 변경). 그런데 같은 절단이 **횡방향 조향 기하까지** 잘라 버린다.
    # 무효화는 차가 장애물 바로 옆일 때 나므로 접촉거리가 짧고, 남는 경로가 2~8 점이 된다
    # (실차 실측: 발행된 정지 경로의 89~94% 가 10 점 미만, 최소 2 점 0.25 m).
    #
    # 되돌릴 때 붙이는 점은 전부 vx=0 이므로 **제동 프로파일은 한 톨도 안 바뀐다** —
    # 어디서 속도가 0 이 되는지는 여전히 접촉점이 정한다. 늘어나는 것은 컨트롤러가 조향
    # 목표를 고를 기하뿐이다.
    #
    # ⚠️ 점 수 하한이 아니라 거리 하한인 이유: densifyPath() 가 이미 짧은 정지 접두부를
    #    minimum_path_points 까지 세분 보간하는데, 그 보간은 **기하 구간을 일부러 안 늘린다**
    #    (2026-08-14, 정지점을 밀지 않으려고). 그래서 점 수로는 이 문제를 못 잰다.
    # false 면 종전 거동으로 정확히 되돌아간다 — 재생 A/B 와 실차 롤백용.
    stop_geometry_extend: true
    # F5 (2026-08-22): 보류가 이 시간 안에 물리적으로 해소되면 safe-stop 래치로 키우지 않고,
    # 이미 타고 있던 회피 기하를 **진입 불연속 검사만 면제해** 몇 사이클 더 유지한다 [s].
    #
    # 왜: 보류 게이트가 붙잡는 조건은 "기동 장애물의 뒤끝이 아직 앞에 있다" 하나이고, 그
    # 해소 시간은 (뒤끝거리)/(속도) 로 바로 나온다. 실측(run_20260822_073013, 자율 98 s):
    #    래치 t   속도    뒤끝     통과필요    실제 래치   완전정지   배율
    #    34.70   3.96   0.18 m   0.045 s    2.37 s     1.04 s    52배
    #    57.95   3.43   0.27 m   0.079 s    2.11 s     0.60 s    27배
    #    80.60   3.75   0.18 m   0.048 s    2.78 s     1.76 s    58배
    # 보류가 물리적으로 요구한 시간의 합 1.25 s vs 실제 정지 5.12 s. 18 cm / 50 ms 조건이
    # 2.4 s 완전 정지로 증폭된다. 증폭의 정체는 safe-stop 래치가 무거운 상태라는 것 —
    # 푸는 조건이 "hard-valid 회피 8회" / "정지한 채 회랑 관측" / "위험구간 통과" 뿐이고
    # 전부 초 단위다.
    #
    # 진입 검사만 끄는 이유: 그 검사가 실제로 재는 것은 추종오차다(간격 p95 중 경로 자체
    # 램프는 0.04 m 뿐). 여기서 요구하는 것은 "이 경로로 수렴하라"가 아니라 "이미 타고 있는
    # 선을 0.05~0.3 초 더 유지하라"이므로 그 오차는 판정 근거가 못 된다.
    # 충돌·트랙경계·곡률은 그대로 본다.
    #
    # 🔴 정지 차량은 명시적 속도 게이트(0.5 m/s)로 배제한다. 멈춰 있으면 장애물을 영영 못
    #    지나가므로 이 완화가 켜지면 안 된다 — 그 경우는 래치의 "정지 후 회랑 clear" 해제
    #    사다리가 담당한다. 나눗셈 바닥만으로는 뚫린다(0.02 m / 0.1 = 0.2 s).
    # 🔴 2026-08-22 실차 A/B/C 이후 기본값 **0 (꺼짐)**.
    #    그 주행에서 검증한 것은 A(전부 끔) / B(F1) / C(F1+F3) 세 팔뿐이고 F5 는 못 돌렸다.
    #    미검증 기능을 기본으로 켜 두지 않는다 — 다음 주행에서 C vs D 로 가른다.
    #    켜기: hold_min_clear_time_sec:=0.3
    hold_min_clear_time_sec: 0.0
    # 위 완화의 누적 노출 상한 [s]. 검출 흔들림으로 뒤끝이 계속 작게 보고돼도 이 시간을
    # 넘으면 종전대로 래치한다. 0.3 s 문턱의 2배 = 최악 6 사이클치 여유.
    hold_brief_max_sec: 0.6
    # 종방향 실현가능 후방 패스의 감속 (2026-08-16). 곡률·간격 캡은 waypoint마다 독립이라
    # S자 전이의 변곡점(κ≈0)에서 캡이 통째로 풀려 프로파일이 튄다 — 14:30 백에서 s=32.89
    # v=6.63 → s=33.14 v=4.58, 즉 0.25 m 만에 46 m/s² 제동 요구. 접근 램프는 장애물 스팬
    # 앞에만 걸려 스팬이 아닌 전이 구간의 이 계단은 못 잡는다. 경로 전체에 뒤에서 앞으로
    # v[i] = min(v[i], sqrt(v[i+1]² + 2a·ds))를 적용해 모든 감속을 제동 가능하게 만든다.
    # 값이 접근 램프의 comfort base(2.0)가 아니라 상한(3.5)인 이유: 이 패스의 목적은
    # "물리적으로 불가능한 계단" 제거이고 그 기준은 comfort가 아니라 실제 제동 능력이다.
    # 2.0으로 두면 곡률이 조금만 출렁여도 프로파일 전체가 끌려 내려가 속도만 잃는다.
    # ⚠️ 이 패스는 계단을 없앨 뿐 속도를 되찾지 않는다.
    profile_feasibility_decel_mps2: 3.5
    # 커밋 경로 유지(retention) 밴드: 이미 커밋된 경로의 재검증에서만 추적오차 예약을 이
    # 비율로 줄여 사용합니다(물리 클리어런스 0.158 m는 절대 축소 안 함, 신규 계획은 항상
    # 전체 예약). 장애물 envelope가 점진 노출로 자라거나 흔들려도 released 밴드 안이면
    # 커밋 경로를 고정하고, 밴드를 실제로 침범할 때만 재계획합니다. 1.0이면 비활성.
    # 2026-08-12 22:34 요청("경로가 계속 흔들리네, 조건 걸어 고정") 반영.
    commitment_retention_reserve_fraction: 0.5
    # 위치추정(MCL) 횡오차 예비량 [m]: trackingErrorReserve()에 상수항으로 합산되어
    # 엔벨로프 확장·하드 검증·gap 속도 역산 전부에 동일하게 반영됩니다. retention 밴드
    # 스케일도 같이 적용(커밋 경로는 절반만 요구). 값 근거: 2026-08-13 00:45 시뮬 실측
    # (tools/mcl_gt_error_probe.py, 181.6s/3145샘플) — GT 대비 횡 |오차| 속도구간별 P95
    # 최악 6.3cm. 10cm 초과는 전부 1~3샘플(≤0.07s) MCL 보정 스파이크(최대 29.6cm)라
    # 정적 마진이 아닌 retention 밴드가 흡수합니다. 실차 전 재측정 필요(시뮬 기준값).
    # 0.12 = 2026-08-14 새 트랙 스캔-맵 정렬 오프셋 실측 p95 0.10~0.11 + 여유
    # (최악 런 0.22는 이상 런으로 제외). 0.06이던 시절 pinch 저속 통과가 실제보다
    # 후하게 판정되어 저속 클립 발생 (run_0814_011624 t=112 등).
    # 🔴 0.12 → 0.06 (2026-08-14 오후): 0.12는 MCL 출력 지연 90ms를 안고 잰 값이었다.
    # 그 지연을 particle_filter 발행 외삽으로 제거한 뒤 실차 재측정 p95 = 0.05(주행 중,
    # 장애물 미검출 프레임 기준)이므로 실측+여유로 0.06을 쓴다. 과도한 예약은 목표
    # 오프셋을 장애물에서 더 밀어내 **차를 벽쪽으로 붙인다** — 같은 상황 재현에서 0.12는
    # target_d -0.615/벽여유 0.260, 0.05는 -0.545/벽여유 0.328로 벽 여유가 26% 깎였다.
    # 🔴 2026-08-15: MCL을 upstream/adaptive_global 것으로 교체하면서 0.12.
    # 0.06은 particle_filter 발행 외삽이 90 ms 출력 지연을 제거한다는 전제로 낮춘
    # 값인데, adaptive_global의 MCL에는 publish_extrapolation_sec 자체가 없다.
    # 지연을 안은 채 0.06을 쓰면 플래너가 추종오차 예약을 과소평가해 경로가 낙관적으로
    # 검증되고 벽 위험이 커지므로 0.12를 쓴다.
    # ⚠️ 외삽이 있는 MCL로 되돌아가면 이 값도 0.06으로 함께 내릴 것.
    # [PROTOTYPE] 원래 0.12 — 위치추정 예비량. 제거.
    localization_reserve_m: 0.0
    # 🔴 0.04 → 0.10 (2026-08-14 저녁). 08/14 실차 벽 접촉 30건을 실측 점유격자로 되짚은
    # 결과, 접촉 순간 "차체 옆면 → 실측 벽" 여유가 중앙값 +0.096 m, p10 +0.011 m였다.
    # 즉 계획상으로는 벽에 닿을 이유가 없었는데 실제로는 닿았다. 차이는 계획 자세와 실제
    # 자세의 어긋남(MCL 잔차 p95 0.05 + 회피 중 heading/slip 오차)이며, 벽 hard validation은
    # 계획 경로의 자세로 회전 사각형을 검사하므로 이 어긋남을 흡수하지 못한다.
