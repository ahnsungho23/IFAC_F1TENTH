local_planner_node:
  ros__parameters:
    # 가장 가까운 정적 장애물 군집만 계획합니다. 모든 거리는 글로벌 Race Line의 Frenet s/d 기준입니다.
    # 15.0 (2026-08-16, 종전 12.0): 7 m/s 체제에서 12 m는 지평 1.7 s뿐이다. 13:20 백에서
    # 8 m 간격 재가속 구간의 접근 램프가 지평에 몰려 매 랩 안전정지 래치가 걸렸다.
    detection_lookahead_m: 15.0
    obstacle_cluster_gap_m: 0.8
    # ⚠️ 실측 대기값 (2026-08-24): detector의 s_start/s_end와 실제 장애물 앞/뒤 면 오차를
    #    측정한 뒤 올릴 값입니다. 이 값은 P3 후보의 **기하 station**도 넓히므로 속도 hold만
    #    보완하려고 올리지 마십시오. confirmed_speed_post_hold_distance_m이 detector 뒤
    #    최소 속도 hold를 독립적으로 담당하며 두 값의 총효과는 max(padding, post_hold)입니다.
    #    측정 전까지 0.0을 유지하며 이것을 검증된 안전마진으로 해석하면 안 됩니다.
    obstacle_longitudinal_padding_m: 0.0

    # 장애물 경계는 detector geometry이며, 운영은 obstacle_reserve_mode="none"이라 추종 LUT를
    # 사용하지 않습니다. 따라서 실제 장애물 횡 clearance는 아래 두 항만 정확히 한 번입니다.
    #
    #   장애물 차량 중심 clearance = vehicle_half_width_m + safety_margin_m
    #   현재 임시값               = 0.15 + 0.00 = 0.15 m
    #
    # vehicle_length/half_width는 base_link 중심 직사각형 물리 footprint이고 마진이 아닙니다.
    # safety_margin_m에는 현 localization+제어로 계획 경로를 추종한 횡오차와 detector 장애물
    # 면 오차를 합친 보수값을 넣되, 같은 오차를 localization_reserve/LUT에 다시 더하지 마십시오.
    vehicle_length_m: 0.56
    # 🔴 2026-08-20: 0.1435 → 0.15 (전폭 0.287 → 0.300 m). 실측 차폭을 올림한 운영값이며,
    #    장애물·벽 여유가 좌우 각 6.5 mm 늘어난다. evaluator/하네스의 0.56 x 0.287 서술은
    #    이 변경 이전 기준이다.
    vehicle_half_width_m: 0.15
    # ⚠️ 실측 대기값 (2026-08-24): LUT를 쓰지 않기로 확정했으므로 이것이 장애물 횡방향의
    #    유일한 추가 마진입니다. 실제 회피 주행에서 |실제 중심-계획 중심|과 detector 면 오차를
    #    같은 map/Frenet 기준으로 측정한 뒤 보수 분위수로 올리십시오. 현재 0.00은 좁은 갭
    #    기능 확인용 임시값이지 안전 검증값이 아닙니다.
    #
    # 과거 선택 근거(479b959d 보존, 안전마진 실측과 구분): 롤 OFF 백 7개의 접근 패스 88개에서
    # 커밋 뒤 **통과측 장애물 면이 경로로 다가온 양**은 2 m 커밋 기준 p50 0.027 / p90
    # 0.107 m였습니다. 장애물/벽 마진 0.05/0.10 조합은 중앙 배치 견딤이 0.025 m라 같은
    # 분포에서 약 13%만 남았고, 0.00/0.04 조합은 배치 폭 0.16 m·견딤 0.08 m로 약 85%가
    # 남았습니다. 이는 0.00이 물리적으로 안전하다는 증거가 아니라, 좁은 갭 후보 생존을 위해
    # 내린 이유입니다. 최종 안전값은 위 재측정으로 별도 결정해야 합니다.
    safety_margin_m: 0.00

    # ── 🔴 추종오차 예약 게이트 (2026-08-22) ──────────────────────────────────
    # "none" 이면 아래 LUT 도, 그 폴백 상수(tracking_error_reserve_m)도 **읽지 않는다**.
    # trackingErrorReserve() 가 localization_reserve_m 만 돌려주므로 후보 검증·갭 역산·
    # 봉투 확장·entry 예산 네 곳이 한 번에 꺼진다.
    #
    # 왜 표를 0 으로 채우지 않고 게이트인가: 이 저장소에서 이미 한 번 되살아났다
    # (아래 "🔴 2026-08-20 복원" 주석 — prototype 이 비운 표가 병합에서 돌아왔다).
    # 35 칸 0 은 병합 한 번에 되돌아가지만, 게이트는 누군가 명시적으로 "lut" 라고 써야
    # 되돌아가고 그 사실이 --show-args 와 백에 남는다.
    #
    # ⚠️ 끈 뒤의 결과 (구조 설명; 현재 마진값은 위 실측 대기 주석을 우선):
    #   · 장애물 clearance = vehicle_half_width_m + safety_margin_m
    #   · gapLimitedAvoidanceSpeed 가 항등함수가 된다 → 좁은 갭을 **저속으로 통과하는
    #     사다리가 사라지고** 갭은 위 clearance에 대한 이진 판정이 된다.
    #   · 그러면 raw 감속 힌트가 유일하게 남는 장애물 캡이 되므로
    #     raw_slowdown_skip_committed 를 함께 켠다(아래).
    #   · 되돌리기: 이 줄만 "lut" 로.
    obstacle_reserve_mode: "none"

    # LUT 무효 시 폴백. 게이트가 "none" 이면 읽히지 않는다. 🔴 2026-08-22: 0.20 → 0.0 —
    # 게이트를 우회해 예약이 되살아나는 경로를 남기지 않기 위한 이중 안전이다.
    tracking_error_reserve_m: 0.0
    # values는 speed-major row-major입니다. 즉 한 speed 행마다 curvature bin 5개가 연속됩니다.
    # 범위 밖 입력은 가장 가까운 끝 셀로 clamp합니다.
    #
    # 아래 값은 tools/cmaes_tuning/tracking_error_lut_from_traces.py가 장애물 없는 주행 구간
    # 924 샘플(ifac_track, gym_bridge + MCL)에서 셀별 최대 |lat_err|를 뽑아 안전계수 1.25를
    # 곱한 결과입니다. 장애물이 없으면 발행 경로 = 글로벌 라인이므로 lat_err가 곧 추종오차이며,
    # 회피 중 의도적 횡이동이 섞이지 않도록 장애물 s +-3 m 구간은 제외했습니다.
    #
    # 이전에는 25칸이 모두 0.14였습니다. 그 상수는 코너에서 실측(최대 0.233)보다 작아
    # 실제로는 마진을 넘어 지나가고 있었고, 저속 직선에서는 실측(0.073)보다 커서 통과 가능한
    # 간격을 막고 있었습니다. 2D로 채우면 양쪽이 동시에 해결됩니다.
    #
    # 레이스라인이 실제로 방문하는 칸은 v>=3.0의 6칸뿐이라 저속 행은 출발 가속·감속 구간에서만
    # 표본이 나옵니다. 표본이 없는 칸은 단조성(속도·곡률 증가 시 비감소)을 지키도록 채웠으며,
    # gap 기반 속도 상한이 이 표를 bisection으로 역산하므로 단조성은 필수입니다.
    #
    # 실차 갱신 절차: Q1/Q3 연습 랩은 규정상 장애물이 없으므로 그 trace를 그대로 위 스크립트에
    # 넣으면 고속 6칸이 갱신됩니다. 저속 행은 레이싱으로는 채워지지 않으므로 저속 2랩이 필요합니다.
    #
    # 🔴 2026-08-13 실차 실측으로 전면 교체 (이전 표는 gym+MCL 시뮬 실측):
    # 실차 6랩(slow20×2, slow25×2, race×2; 3,926 장애물-무 샘플; lap_referee를 젯슨에서
    # 실행), 기준선 = 주행 당시 라이브 /global_waypoints 덤프(실트랙 최대 |κ|=0.694 —
    # κ>=0.9 열은 이 트랙에 존재하지 않는 영역이라 단조 확장값임, n=0 정상).
    # 실차 추종오차는 시뮬의 약 1.5~2배다 (v[1.5,3) 직선 max 0.205 vs 시뮬 0.14;
    # v[3,4.5) k[0.2,0.5) max 0.446 — p95는 0.224로, max에는 MCL 보정 스파이크가
    # 섞였을 수 있으나 도구 설계대로 max×1.25를 채택). lat_err는 MCL pose 기준이라
    # 위치추정 오차가 이미 포함돼 있고 localization_reserve_m 0.06이 그 위에 더해진다
    # (보수적 이중마진 — 의도된 선택, AGENTS.md 참고).
    # ⚠️ 규정 최소간격(자유폭 0.5 m) 통과 조건 "2.0 m/s 직선 예약 <= 0.109"는 실측이
    # 크게 초과한다(2.0 m/s 직선 예약 ~0.26, v=0 행도 0.20). 즉 이 표로는 최소간격
    # 통로를 어느 속도로도 통과하지 않고 margin-pass/safe-stop 사다리로 처리한다 —
    # 추종 정확도(제어) 개선 없이는 회피 불가가 물리적 사실이다.
    # 🔴 2026-08-19 실차 재측정. 08-14 표를 통째로 대체한다.
    # 기준선: 그 주행의 라이브 /global_waypoints 덤프 (172점, 42.81 m, max|κ| 0.460).
    # 17랩 전부 완주·충돌 0, /state 는 693초 내내 GLOBAL 100% (local_planning 을 띄우지
    # 않아 /avoid_waypoints 토픽 자체가 없다 — 회피 진폭 오염이 원천적으로 없다).
    # 위치추정은 kinematic_localization. 표본 14,063개.
    #
    # ── 축을 바꾼 이유 ─────────────────────────────────────────────────────────
    # 곡률: 라인 실측 max|κ| = 0.460 이다. 옛 축의 [0.5,0.9) 와 [0.9,1.316) 은 점유 0% 인
    #   죽은 칸이었다 — 상단을 차량 조향한계(1.3163)로 잡았던 탓이다. 그 값은 "낼 수 있는
    #   곡률"이지 "라인이 방문하는 곡률"이 아니다. 새 축의 칸 점유는 31/12/33/23%.
    #   ⚠️ 이보다 급한 코너가 있는 트랙으로 가면 상단이 클램프된다. 라인을 다시 만들면
    #      tools/raceline_axis_report.py 로 축부터 다시 잡을 것.
    # 속도: 라인의 계획속도가 아니라 캡을 걸고 돈 랩이 실제로 만든 표본 분포로 잡았다.
    #   칸별 표본 [3157, 3128, 2078, 4211, 1583, 639]. 1.0 에 노드를 두는 것은
    #   avoidance_minimum_speed_mps 가 1.0 이라 갭 통과 가부를 그 행이 결정하기 때문이다.
    #
    # ── 출발 과도구간 배제 (필수) ──────────────────────────────────────────────
    # 정지에서 출발하면 두 가지가 겹친다. 배제하지 않으면 표가 통째로 망가진다.
    #  (1) 떨림 — 구동계가 몇 초 버벅이며 v 가 0 과 1 m/s 를 오간다. --min-speed 만으로는
    #      못 거른다(떨림 중에도 v 가 순간 1.0 까지 튄다). crawl10_lap1 은 8.4초,
    #      slow16_lap1 은 9.9초였고 그 구간 |lat_err| 최대가 0.835 m 다.
    #  (2) 초기 가속 — 떨림 없이도 v 가 cmd_v 를 따라잡는 데 ~1초 걸린다. 이 구간 표본은
    #      **라벨이 틀린다**: 표는 측정 v 로 비닝하는데 그때 오차를 만든 것은 명령된 주행
    #      영역이다(full_lap3 t=0.4s 는 v=1.14 인데 cmd_v=3.36).
    #      v/cmd_v < 0.8 인 표본 269개가 전부 t<1s 에 있고 그 |lat_err| p95 가 0.405,
    #      전체는 0.163 이다. 정상 주행의 v/cmd_v 는 p10=0.96~p50=0.99 라 문턱 0.7 은
    #      정상 구간을 건드리지 않는다.
    # 판정에 lat_err 를 쓰지 않는다 — 오차로 자르면 "오차가 커서 오차 큰 표본을 버리는"
    # 순환이 되어 표가 체계적으로 낙관적이 된다. 둘 다 속도 현상이므로 속도로만 잘랐다.
    # 배제 2,355 표본(13.7%). 배제 전 이 표는 κ≥0.2 전 칸이 1.045 로 뭉갰다.
    #
    # ── 셀 대표값을 max 가 아니라 p95 로 잡은 이유 ──────────────────────────────
    # 표본이 1000개를 넘으면 max 는 사실상 단 하나의 순간이 칸 전체를 정한다. 실제로
    # 같은 칸의 p95 와 max 가 0.150 대 0.446 으로 3배 갈렸다. max/p99 로 만든 표는
    # κ≥0.2 에서 v 에 대해 두 계단(0.345/0.560)뿐이고 κ 에는 아예 평평하다 — 감속해도
    # 요구폭이 안 줄어 "좁은 간격을 천천히 통과"하는 사다리가 막힌다. 그 형태가 08-19
    # 시뮬에서 주행의 31%를 정지로 만든 원인이었다.
    # p95 를 넘는 표본 703개(5.00%)의 위험을 실측으로 확인했다:
    #   초과폭 중앙 11 mm, p90 101 mm, 최대 199 mm (safety_factor 1.25 가 덮는다)
    #   이탈한 쪽 경계까지 남은 여유 최소 0.387 m → 차체 반폭을 빼도 벽까지 +0.244 m
    #   여유가 음수인 표본 0개. LUT 는 trackBoundaryReserve 에 들어가지 않으므로
    #   p95 초과가 벽 충돌로 직결되지도 않는다.
    #
    # ── 알고 쓸 것: 계통 편향 +2~3.6 cm 가 이 표에 포함돼 있다 ──────────────────
    # 부호 있는 lat_err 의 중앙값이 +0.043 m(좌측)이고, 23개 셀 중 21개에서 양수다.
    # 좌회전 루프인데 **우회전 구간에서도 +0.039** 라 코너 컷이 아니라 상수 오프셋이다.
    # 조향 트림 탓이 아니다 — 같은 속도대 직선에서 트림이 −0.21°~+0.60° 로 움직여도
    # 편향은 +0.02 근처에 그대로였다(트림은 피드포워드라 L1 피드백이 흡수한다).
    # 위치추정 편향도 아니다 — 컨트롤러가 믿음 좌표계에서 0으로 만들므로 lat_err 에
    # 나타날 수 없다. 남는 설명은 **적분항 없는 컨트롤러의 정상상태 오차**다(지속 외란에
    # 대해 P형은 0 으로 수렴하지 않는다). 대회에서도 재현되므로 빼지 않는다.
    # 컨트롤에 횡오차 적분이 들어가면 이 표는 그만큼 더 작아질 수 있다.
    #
    # ── 실측 셀 (p95, 표본수) ──────────────────────────────────────────────────
    #            κ[0,0.1)   κ[0.1,0.2)  κ[0.2,0.35) κ[0.35,0.46)
    #  v[0,1.0)  0.073/737  0.068/431   0.062/1033  0.103/807
    #  v[1,1.6)  0.076/1329 0.128/343   0.091/882   0.102/483
    #  v[1.6,2.2)0.079/591  0.102/192   0.086/681   0.103/516
    #  v[2.2,2.9)0.114/1169 0.113/421   0.150/1390  0.181/1024
    #  v[2.9,4.5)0.218/185  0.119/48    0.247/582   0.290/580
    #  v[4.5,7.0)0.143/384  0.180/132   0.227/123   표본 없음
    #  (v[4.5,7.0) 의 실측은 오히려 v[2.9,4.5) 보다 작지만, 표는 단조성 강제 때문에
    #   v=2.9 값을 물려받는다. gapLimitedAvoidanceSpeed 의 이분 탐색이 단조성을 전제로
    #   하므로 구조상 낮출 수 없다.)
    #
    # ── 08-14 표 대비 ──────────────────────────────────────────────────────────
    # 실제 주행 분포 14,063 표본으로 가중하면 평균 0.393 -> 0.242 m (-38.4%).
    # 모든 (v,κ) 조합에서 감소하며 증가하는 조합이 하나도 없다.
    #   v=1.0 전 구간   0.395 -> 0.165  (-58.2%)
    #   v=2.0 κ=0.30    0.395 -> 0.230  (-41.8%)
    #   v=3.0 κ=0.30    0.395 -> 0.365  ( -7.6%)
    # 옛 표는 κ>=0.2 에서 v 와 무관하게 0.395 로 완전히 평평했다 — 감속해도 요구폭이
