local_planner_node:
  ros__parameters:
    # 가장 가까운 정적 장애물 군집만 계획합니다. 모든 거리는 글로벌 Race Line의 Frenet s/d 기준입니다.
    detection_lookahead_m: 12.0
    obstacle_cluster_gap_m: 0.8
    obstacle_longitudinal_padding_m: 0.3

    # 장애물 상자를 이 값만큼 횡방향으로 팽창한 뒤 차량 중심 경로를 만듭니다.
    # vehicle_half_width_m와 중복 합산하지 않도록 차량 반폭+추가 여유를 합친 값으로 설정합니다.
    obstacle_clearance_m: 0.30
    blocking_margin_m: 0.10
    vehicle_half_width_m: 0.121
    boundary_margin_m: 0.10
    fallback_track_half_width_m: 1.50

    # 참고 구현의 7개 pre/apex/post 제어점 개념을 정적 장애물 상자의 앞/뒤 경계로 확장했습니다.
    # 배열은 각각 [먼 점, 중간 점, 가까운 점], [가까운 점, 중간 점, 먼 점] 순서입니다.
    pre_apex_distances_m: [4.0, 3.0, 1.5]
    post_apex_distances_m: [1.5, 3.0, 4.0]
    # 짧은 spline부터 검사하고 곡률/경계 검사에 실패하면 같은 d-offset을 더 길게 펼칩니다.
    transition_distance_scales: [1.0, 1.25, 1.50]
    # 코너 바깥쪽 회피는 reference 구현처럼 전환 길이를 더 늘려 조향을 완만하게 합니다.
    outside_line_transition_scale: 1.35
    # d=0 합류점 뒤 글로벌 점을 덧붙여 controller와 state machine이 tail을 안정적으로 확인합니다.
    post_merge_lookahead_m: 2.0
    minimum_target_offset_m: 0.20
    maximum_target_offset_m: 1.50

    # 이동된 글로벌 점의 기하학적 주행 가능성 검사입니다.
    maximum_lateral_slope: 0.65
    maximum_curvature_radpm: 3.20
    maximum_curvature_rate_radpm2: 20.0

