# ================================================================================================
# OPPONENT DETECTOR CONFIGURATION
# ================================================================================================
# LiDAR-only dynamic opponent detection & tracking with Frenet output.
# The launch file overrides ego_odom_topic / simulator based on the `simulator:=` argument.
# ================================================================================================

opponent_detector:
  ros__parameters:
    # === ROS INTERFACE ===
    scan_topic: "/scan"                       # LaserScan input (ego)
    global_waypoints_topic: "/global_waypoints"   # f110_msgs/WpntArray (latched) from new_map_con
    map_topic: "/map"                          # nav_msgs/OccupancyGrid (latched) from MCL
    ego_odom_topic: "/pf/pose/odom"            # ego pose in map frame (MCL). Sim: /ego_racecar/odom
    obstacles_topic: "/perception/obstacles"   # tracked obstacles (ObstacleArray)
<<<<<<< HEAD
