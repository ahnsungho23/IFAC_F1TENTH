lap_referee:
  ros__parameters:
    # Reference raceline used for progress / lap / lateral-error computation.
    # The geometry is identical across rollouts; only vx_mps changes, so the
    # base CSV (or any candidate CSV with the same x_m,y_m) is acceptable.
    waypoints_csv: ''

    # Simulator topic profile (matches f1tenth_gym_ros gym bridge defaults).
    odom_topic: /ego_racecar/odom
    scan_topic: /scan          # f1tenth gym bridge publishes ego scan un-namespaced
    drive_topic: /drive
    collision_topic: /ego_racecar/collision  # gym bridge latched std_msgs/Bool

    # Where one rollout writes <prefix>_summary.json and <prefix>_trace.csv.
    output_dir: /tmp/lap_referee
    output_prefix: rollout

    record_rate_hz: 50.0

    # Episode start: t0 is set when body speed first exceeds this.
    start_speed_threshold: 0.4
    # No-motion guard: give up the episode if the car never starts.
    no_start_timeout_sec: 8.0

    # Collision / termination detection. Once collision_topic has been received,
    # it is authoritative; this scan threshold is used only if no Bool arrived.
    collision_scan_threshold: 0.13   # [m] fallback min LiDAR range
    off_track_threshold: 1.5         # [m] |lateral error| treated as leaving track
    stuck_speed_threshold: 0.2       # [m/s] body considered "not moving"
    stuck_cmd_threshold: 0.8         # [m/s] commanded speed considered "intending to move"
    stuck_time_sec: 0.7              # [s] stuck duration before declaring collision

    # Lap completion: accumulated forward progress reaches this fraction of the
    # measured track length.
    lap_fraction: 0.97
    max_episode_time_sec: 60.0
    startup_grace_sec: 0.5           # ignore collision checks right after launch

    stop_vehicle_on_exit: true       # latch zero /drive when the rollout ends
    shutdown_on_terminate: true      # exit the process so the orchestrator sees completion
