# map.kissmap 을 kinematic_localization 이 /map 으로 발행한 격자를 그대로 저장한 것.
# 🔴 이것이 **런타임에 플래너·검증기가 보는 맵**이다. maps/map.png(165x385, origin -0.741,-1.626)
#    는 별도 렌더라 좌표계와 경계가 다르다 — 라인을 그쪽으로 뽑으면 런타임 맵과 어긋난다.
#    실제로 2026-08-20 이전 라인은 map.png 로 뽑혀 d_left/d_right 가 런타임 맵보다
#    p50 +0.100 m, 최대 +0.206 m 낙관적이었고(172점 중 49.4%가 0.10 m 초과), 그 낙관이
#    좌우 판정을 흔들었다(회피 경로 좌우 부호 전환 36회 중 14회가 s=32~36 에 집중).
#    이 렌더로 다시 뽑으니 낙관 편향이 0% 가 됐다.
# 출처: run_025048 의 /map (438x190). 트랙 내부만 자유(254), 외부는 미지(205) 로 표시했다
#    — 원본은 점유/미지 두 값뿐이라 생성기가 내부를 주행가능으로 보지 못한다.
# ⚠️ map.kissmap 을 다시 뜨면 이 파일과 라인을 함께 다시 만들 것.
