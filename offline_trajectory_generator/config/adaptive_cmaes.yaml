# CMA-ES search space for the 142 x 11 adaptive-side evaluation grid.
# transition_gap_* are positive increments, so decoded scales are always ordered.
transition_distance_scales:
  initial: [0.1, 0.6, 2.0]
  first_bounds: [0.1, 0.8]
  first_gap_bounds: [0.05, 1.2]
  second_gap_bounds: [0.05, 1.8]

parameter_ranges:
  outside_line_transition_scale:
    initial: 0.1
    bounds: [0.1, 2.0]
  commitment_clearance_reserve_m:
    initial: 0.0
    bounds: [0.0, 0.1]
  minimum_avoidance_clearance_m:
    initial: 0.151
    bounds: [0.151, 0.25]
  boundary_margin_m:
    initial: 0.028
    bounds: [0.028, 0.15]
  minimum_target_offset_m:
    initial: 0.15
    bounds: [0.15, 0.35]
  maximum_lateral_slope:
    initial: 0.8
    bounds: [0.4, 0.8]
